        if(colon>=0)step.append(h('p',null,text.slice(colon+1).trim()));
        if(index===1)step.append(h('pre',{class:'tutorial-code'},tutorialSetupSnippet()));
        if(index%2===1)step.append(h('pre',{class:'tutorial-code'},tutorialSnippet((index-1)/2)));
        stepList.append(step);
      });
      panel.append(stepList);
    }
  }
  selectTab(initialTab==='link'?'link':'builder');
  openModal(tutorialTitle,'',h('div',null,tabs,panel),[modalButton(tr('welcomeContinue'),closeModal,true)]);
}
function showRecommendation(){
  playUiSfx('popup');
  openModal(tr('recommendTitle'),tr('recommendBody'),null,[
    modalButton(tr('welcomeTutorial'),function(){showTutorial();},true),
    modalButton(tr('welcomeContinue'),closeModal)
  ]);
}
function showVersionChooser(fromWelcome){
  var choices=h('div',{class:'modal-choices'},
    h('button',{class:'modal-choice',type:'button',onclick:function(){requestVersion('gen2',fromWelcome?'welcome':'options');}},'Rayfield Gen 2'),
    h('button',{class:'modal-choice',type:'button',onclick:function(){requestVersion('classic',fromWelcome?'welcome':'options');}},'Rayfield'));
  playUiSfx('popup');
  openModal(tr('welcomeVersion'),'',choices,[modalButton(tr('cancel'),function(){if(fromWelcome)showWelcome();else closeModal();})]);
}
function requestVersion(target,origin){
  origin=origin||'options';
  hideOptions();
  if(target===version){closeModal();if(origin==='welcome')showWelcome();return;}
  if(target==='classic'){
    if(origin==='welcome'){applyVersion('classic',true);return;}
    versionConfirmReturn=origin;
    playUiSfx('popup');
    openModal(tr('switchTitle'),tr('switchBody'),null,[
      modalButton(tr('cancel'),function(e){e.stopPropagation();cancelVersionConfirmation();}),
      modalButton(tr('switchYes'),function(){applyVersion('classic',true);},true)
    ]);
    return;
  }
  applyVersion(target,false);
}
function applyVersion(next,reset){
  versionConfirmReturn=null;hideOptions();
  version=next;
  try{localStorage.setItem(VKEY,version);}catch(e){}
  if(reset){
    blank();logs=[];unseen=0;mode='crear';minimized=false;previewScale=1;previewOffsetX=0;previewOffsetY=0;capture=null;
    $('#notes').replaceChildren();$('#tcTop').replaceChildren();$('#tcBot').replaceChildren();
  }else{
    S.win.subtitle=versionName();
  }
  dismissWelcome();closeModal();renderAll();persist();showRecommendation();
}
function renderOptionsMenu(){
  var pop=$('#optionsPop');
  pop.setAttribute('aria-label',tr('options'));
  var title=h('div',{class:'options-head'},
    h('button',{class:'options-close',type:'button','aria-label':tr('cancel'),onclick:function(){closeOptions();}},'×'),
    h('span',{id:'optionsTitle'},tr('options')));
  var segment=h('div',{class:'version-segment'+(version==='classic'?' is-classic':''),role:'radiogroup','aria-label':tr('welcomeVersion')},
    h('span',{class:'version-indicator','aria-hidden':'true'}),
    h('button',{class:'version-choice'+(version==='gen2'?' selected':''),type:'button',role:'radio','aria-checked':String(version==='gen2'),onclick:function(){selectVersion('gen2');}},'Rayfield Gen 2'),
    h('button',{class:'version-choice'+(version==='classic'?' selected':''),type:'button',role:'radio','aria-checked':String(version==='classic'),onclick:function(){selectVersion('classic');}},'Rayfield'));
  pop.replaceChildren(
    title,
    h('button',{class:'options-tutorial',type:'button',onclick:function(){hideOptions();showTutorial();}},tr('welcomeTutorial')),
    segment);
}
function selectVersion(target){
  var segment=$('.version-segment'),buttons=Array.prototype.slice.call(segment.querySelectorAll('.version-choice'));
  if(versionSwitchTimer!==null)return;
  if(target===version){playUiSfx('tap');return;}
  segment.classList.toggle('is-classic',target==='classic');
  buttons.forEach(function(button,index){
    var selected=(index===0?target==='gen2':target==='classic');
    button.classList.toggle('selected',selected);
    button.setAttribute('aria-checked',String(selected));
  });
  segment.classList.add('is-moving');
  segment.setAttribute('aria-busy','true');
  playUiSfx('glass');
  var reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  versionSwitchTimer=setTimeout(function(){
    versionSwitchTimer=null;
    segment.classList.remove('is-moving');
    segment.removeAttribute('aria-busy');
    requestVersion(target,'options');
  },reduced?0:520);
}
function buttonSfxKind(button){
  if(button.classList.contains('version-choice'))return null;
  if(button.matches('.tg,[role="switch"]'))return button.getAttribute('aria-checked')==='true'?'switch-off':'switch-on';
  if(button.classList.contains('danger'))return 'danger';
  if(button.matches('.addb,.chip.add,.btn.primary'))return 'add';
  if(button.matches('.rf-tab,.mode,.chip,.ob,.go,[role="tab"],[role="option"]'))return 'select';
  if(button.matches('.modal-choice,.modal-actions .btn,.options-tutorial'))return 'pop';
  return 'tap';
}
function toggleOptions(){
  var pop=$('#optionsPop'),btn=$('#optionsBtn'),open=pop.hidden;
  if(open)openOptionsPanel();
  else closeOptions();
}

/* ---------- keyboard (preview keybinds) ---------- */
function keyName(e){
  var c=e.code||'',m={ShiftLeft:'LeftShift',ShiftRight:'RightShift',ControlLeft:'LeftControl',ControlRight:'RightControl',AltLeft:'LeftAlt',AltRight:'RightAlt',ArrowUp:'Up',ArrowDown:'Down',ArrowLeft:'Left',ArrowRight:'Right',Enter:'Return'};
  if(/^Key[A-Z]$/.test(c))return c.slice(3);
  if(/^Digit\d$/.test(c))return ['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine'][+c.slice(5)];
  return m[c]||c||e.key;
}
function eachBind(name,fn){S.tabs.forEach(function(t){t.items.forEach(function(it){
  if(it.type==='keybind'&&String(rt[it.id]||it.props.value).toLowerCase()===name.toLowerCase())fn(it);});});}
document.addEventListener('keydown',function(e){
  var tg=e.target&&e.target.tagName;
  if(e.key==='Escape'&&$('#modalRoot').firstChild){if(versionConfirmReturn!==null)cancelVersionConfirmation();else{closeModal();dismissWelcome();}return;}
  if(e.key==='Escape'&&!$('#optionsPop').hidden){closeOptions();return;}
  if(e.key==='Escape'&&!$('#langMenu').hidden){closeMenu();return;}
  if(capture){e.preventDefault();var c=capture;capture=null;if(e.key==='Escape'){renderPreview();renderCon();return;}c(keyName(e));return;}
  if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT'||e.repeat)return;
  var n=keyName(e);
  eachBind(n,function(it){logCb(it,it.props.hold?'callback(true)':'callback('+q(n)+')');fireNotifs(it.id);});
});
document.addEventListener('keyup',function(e){
  var tg=e.target&&e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT')return;
  eachBind(keyName(e),function(it){if(it.props.hold)logCb(it,'callback(false)');});
});
document.addEventListener('click',function(e){
  if(!e.target.closest('.lang'))closeMenu();
  if(!e.target.closest('.options-wrap'))closeOptions();
});
document.addEventListener('click',function(e){
  var button=e.target.closest&&e.target.closest('button');
  if(!button||button.disabled||button.getAttribute('aria-disabled')==='true')return;
  var kind=buttonSfxKind(button);
  if(kind)playUiSfx(kind);
},true);
window.addEventListener('pointermove',movePreview);
window.addEventListener('pointerup',endPreviewDrag);
window.addEventListener('pointercancel',endPreviewDrag);
window.addEventListener('resize',function(){renderTools();updateModeIndicator();if(!$('#optionsPop').hidden)positionOptionsMenu();});
window.addEventListener('scroll',function(){if(!$('#optionsPop').hidden)positionOptionsMenu();},{passive:true});
$('#homeBtn').addEventListener('click',openHome);
$('#projectImport').addEventListener('change',function(e){importProjectFile(e.target.files&&e.target.files[0]);e.target.value='';});
$('#langBtn').addEventListener('click',function(){
  var m=$('#langMenu'),open=m.hidden;m.hidden=!open;this.setAttribute('aria-expanded',String(open));});
$('#copyTop').addEventListener('click',copyLua);
$('#optionsBtn').addEventListener('click',toggleOptions);

/* ---------- boot ---------- */
var restored=load(),welcomeSeen=false;
try{welcomeSeen=localStorage.getItem(WELCOME_KEY)==='1';}catch(e){}
if(restored)dismissWelcome();
syncActiveProject();
logs.push({t:new Date(),kind:'sy',msg:tr('ready')});
renderAll();
openHome();
if(!restored&&!welcomeSeen)showWelcome();
})();
</script>
