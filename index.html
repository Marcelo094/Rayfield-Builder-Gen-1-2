<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rayfield Builder Gen 1/2!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: vista previa a la izquierda, consola de creación con modos a la derecha. */
:root{
  --bg:#f3f4f8; --panel:#ffffff; --panel2:#eceef5; --field:#f5f6fa; --line:#d8dce8;
  --fg:#161a26; --mut:#5b6377; --accent:#2f6fd0; --accent-soft:#dfe9fb; --accent-fg:#ffffff;
  --stage:#e6e9f1; --dot:#c3c9d8; --code-bg:#11131b; --code-fg:#d6dbea;
  --bad:#c93d35; --ok:#1c9460; --preview-height:calc(100vh - 110px);
}
@supports (height:100dvh){:root{--preview-height:calc(100dvh - 110px)}}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d0f16; --panel:#151821; --panel2:#1c202b; --field:#0f1219; --line:#272c3a;
  --fg:#e7e9f2; --mut:#8e96ab; --accent:#5b9bf0; --accent-soft:#1a2a45; --accent-fg:#08101f;
  --stage:#090b11; --dot:#1d2230; --code-bg:#0a0c12; --code-fg:#d6dbea; --bad:#f0716a; --ok:#47c48a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d0f16; --panel:#151821; --panel2:#1c202b; --field:#0f1219; --line:#272c3a;
  --fg:#e7e9f2; --mut:#8e96ab; --accent:#5b9bf0; --accent-soft:#1a2a45; --accent-fg:#08101f;
  --stage:#090b11; --dot:#1d2230; --code-bg:#0a0c12; --code-fg:#d6dbea; --bad:#f0716a; --ok:#47c48a; color-scheme:dark;}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}
button:not(:disabled){transition:transform .18s cubic-bezier(.2,.8,.2,1),background-color .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease,filter .18s ease}
button:not(:disabled):hover{transform:translateY(-1px)}
button:not(:disabled):active{transform:translateY(1px) scale(.98);filter:brightness(.96);transition-duration:.08s}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;box-shadow:0 0 0 4px var(--accent-soft)}
button:disabled{cursor:not-allowed;opacity:.55;transform:none!important;filter:none!important;box-shadow:none}
@media (hover:none){button:not(:disabled):hover{transform:none}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font:600 22px/1.2 "Space Grotesk",Inter,sans-serif;margin:0;letter-spacing:-.01em}
.top{position:relative;z-index:32;width:100%;max-width:none;margin:0 auto 14px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.top.project-editor{grid-template-columns:auto minmax(0,1fr) auto}
.top.project-editor>div:first-child{display:none}
.top.project-editor .options-wrap{grid-column:1;justify-self:start}
.top.project-editor .top-r{grid-column:3}
.sub{margin:2px 0 0;color:var(--mut);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;vertical-align:middle;line-height:1.2;min-height:40px;padding:8px 15px;border-radius:11px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),var(--panel2));color:var(--fg);font-weight:650;font-size:13px;letter-spacing:-.01em;box-shadow:0 2px 5px rgba(12,20,38,.07),inset 0 1px 0 rgba(255,255,255,.58)}
.btn:hover{background:var(--panel);border-color:var(--accent);color:var(--accent);box-shadow:0 6px 16px var(--accent-soft),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent));border-color:var(--accent);color:var(--accent-fg);box-shadow:0 4px 12px var(--accent-soft),inset 0 1px 0 rgba(255,255,255,.24)}
.btn.primary:hover{filter:brightness(1.07);box-shadow:0 7px 20px var(--accent-soft),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.sm{min-height:34px;padding:6px 11px;font-size:12px;border-radius:9px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 32%,var(--line));background:color-mix(in srgb,var(--bad) 5%,var(--panel))}
.btn.danger:hover{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel));color:var(--bad);box-shadow:0 5px 14px color-mix(in srgb,var(--bad) 16%,transparent)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--bad) 30%,transparent)}

.app{width:100%;max-width:none;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,440px);gap:16px;align-items:start}
.stage{position:relative;height:var(--preview-height);min-height:0;padding:44px 22px 22px;border:1px solid var(--line);border-radius:14px;background-color:var(--stage);overflow:hidden;
  background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:18px 18px;display:flex;justify-content:center;align-items:flex-start;min-width:0}
.stage-label{position:absolute;left:16px;top:13px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
#rf{width:100%;height:100%;max-width:560px;min-height:0;overflow:visible}
.notes{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;width:min(250px,calc(100% - 28px));pointer-events:none}
.note{background:var(--code-bg);color:var(--code-fg);border:1px solid #2c3243;border-radius:10px;padding:9px 12px;font-size:12.5px;animation:nin .25s ease-out}
.note b{display:block;font-weight:600}
@keyframes nin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---- ventana Rayfield (aproximación) ---- */
.rf{--rbg:#191a1d;--rel:#232428;--rstroke:#34363c;--rtext:#eef0f4;--rsub:#9a9fab;--racc:#3d8fe0;--rfield:#131417;
  height:100%;max-height:100%;display:flex;flex-direction:column;background:var(--rbg);color:var(--rtext);border:1px solid var(--rstroke);border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden;font-size:13px}
.rf.minimized{height:auto!important;flex:0 0 auto}
.rf[data-th="cobalt"]{--rbg:#0f1829;--rel:#162540;--rstroke:#243a5e;--rtext:#e9f0ff;--rsub:#8fa4c8;--racc:#3b82f6;--rfield:#0b1322}
.rf[data-th="ember"]{--rbg:#1b1310;--rel:#2a1d17;--rstroke:#43302a;--rtext:#fbeee8;--rsub:#b69a8d;--racc:#f2733a;--rfield:#140d0b}
.rf[data-th="amethyst"]{--rbg:#181228;--rel:#231a3b;--rstroke:#382a5c;--rtext:#f1eaff;--rsub:#a99bc9;--racc:#a574ff;--rfield:#110c1d}
.rf[data-th="frost"]{--rbg:#eef3f8;--rel:#ffffff;--rstroke:#d3dce8;--rtext:#1b2633;--rsub:#6a7a8c;--racc:#2f7fd6;--rfield:#e3eaf3}
.rf[data-th="rose"]{--rbg:#1f1218;--rel:#2d1a23;--rstroke:#47293a;--rtext:#ffeaf1;--rsub:#c09aab;--racc:#ee5f8d;--rfield:#170d12}
.rf-top{display:flex;align-items:center;gap:8px;padding:13px 14px 10px}
.rf-tt{flex:1;min-width:0;cursor:grab;user-select:none;touch-action:none}
.rf-tt:active{cursor:grabbing}
.rf-title{font:600 15px/1.2 "Space Grotesk",Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rf-sub{font-size:11.5px;color:var(--rsub);margin-top:1px}
.rf-wb{width:30px;height:30px;border-radius:10px;border:1px solid var(--rstroke);background:var(--rel);color:var(--rsub);line-height:1;font-size:15px;padding:0;box-shadow:0 2px 5px rgba(0,0,0,.18)}
.rf-wb:hover{color:var(--racc);border-color:var(--racc);background:var(--rfield);box-shadow:0 4px 10px rgba(0,0,0,.2)}
.rf-body{display:flex;flex:1 1 auto;flex-direction:column;min-height:0;overflow:hidden}
.rf-tabs{display:flex;gap:6px;padding:3px 14px 10px;overflow-x:auto}
.rf-tabs{flex:0 0 auto}
.rf-tab{display:inline-flex;align-items:center;gap:7px;max-width:100%;overflow:hidden;border:1px solid transparent;background:transparent;color:var(--rsub);padding:6px 12px;border-radius:9px;white-space:nowrap;font-weight:600}
.rf-tab:hover{background:var(--rel);color:var(--rtext);border-color:var(--rstroke)}
.rf-tab.on{background:var(--racc);border-color:var(--racc);color:#fff;box-shadow:0 3px 9px rgba(0,0,0,.24)}
.rf-tab-image-badge{width:17px;height:17px;display:grid;place-items:center;flex:none;border-radius:4px;background:rgba(255,255,255,.13)}
.rf-tab-image-badge .ic{width:13px;height:13px}
.chip-tab-image{width:16px;height:16px;display:grid;place-items:center;flex:none;border-radius:4px}
.chip-tab-image .ic{width:13px;height:13px}
.rf-tab-name,.tab-chip-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rf.side .rf-body{display:grid;grid-template-columns:128px minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.rf.side .rf-tabs{flex-direction:column;padding:3px 0 10px 12px;min-height:0;overflow:auto}
.rf.side .rf-tab{text-align:left;border-radius:9px}
.rf.side .rf-tab{width:100%}
.rf-content{padding:2px 14px 14px;display:flex;flex:1 1 auto;flex-direction:column;gap:8px;min-height:0;overflow:auto;min-width:0}
.rf.side .rf-content{padding-left:10px}
.rf-empty{color:var(--rsub);text-align:center;padding:28px 10px;border:1px dashed var(--rstroke);border-radius:10px}
.el{background:var(--rel);border:1px solid var(--rstroke);border-radius:11px;padding:10px 12px;display:flex;align-items:center;gap:12px;cursor:pointer;min-width:0;transition:transform .18s cubic-bezier(.2,.8,.2,1),border-color .18s ease,box-shadow .18s ease,background-color .18s ease}
.el:hover,.bare:hover{transform:translateY(-1px)}
.el:active,.bare:active{transform:scale(.985)}
.el.slider-row:hover{transform:translateY(-1px)}
.el.slider-row:active{transform:scale(.99)}
.el:hover{border-color:var(--rsub);box-shadow:0 5px 14px rgba(0,0,0,.16)}
.el.sel,.bare.sel{outline:2px solid var(--racc);outline-offset:1px}
.el.col{flex-direction:column;align-items:stretch;gap:9px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.tx{flex:1;min-width:0}
.nm{font-weight:600}
.ds{font-size:11.5px;color:var(--rsub);margin-top:1px}
.chev{color:var(--rsub);font-size:15px}
.sw{width:38px;height:22px;border-radius:22px;background:var(--rfield);border:1px solid var(--rstroke);position:relative;flex:none;transition:background .15s}
.sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--rsub);transition:transform .15s,background .15s}
.sw.on{background:var(--racc);border-color:var(--racc)}
.sw.on i{transform:translateX(16px);background:#fff}
.sl-v{font:500 12px "JetBrains Mono",ui-monospace,monospace;color:var(--rsub);font-variant-numeric:tabular-nums}
.sl-tr{height:8px;border-radius:8px;background:var(--rfield);position:relative;cursor:pointer;touch-action:none;margin:4px 8px 2px 0}
.sl-tr::after{content:"";position:absolute;inset:-9px 0}
.sl-fill{height:100%;border-radius:8px;background:var(--racc)}
.sl-tr.min{height:4px}
.dd-v{color:var(--rsub);font-size:12px;max-width:45%;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-l{background:var(--rfield);border:1px solid var(--rstroke);border-radius:8px;overflow:hidden}
.dd-o{padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;transition:background-color .16s ease,color .16s ease}
.dd-o:hover{background:var(--rel);color:var(--rtext)}
.dd-o.on{color:var(--racc);font-weight:600}
.dd-o .ic{font-size:14px}
.fld{background:var(--rfield);border:1px solid var(--rstroke);border-radius:8px;padding:6px 9px;width:min(170px,48%);color:var(--rtext);font-size:12.5px;min-width:0}
.fld:focus{outline:2px solid var(--racc);outline-offset:0}
.kb{font:500 12px "JetBrains Mono",ui-monospace,monospace;background:var(--rfield);border:1px solid var(--rstroke);color:var(--rtext);border-radius:9px;padding:5px 11px;min-width:42px;box-shadow:0 2px 5px rgba(0,0,0,.16)}
.kb.on{border-color:var(--racc);color:var(--racc)}
.cp-h{font:500 11.5px "JetBrains Mono",ui-monospace,monospace;color:var(--rsub)}
input[type=color].cp{width:34px;height:24px;border:1px solid var(--rstroke);border-radius:7px;padding:0;background:none;cursor:pointer;flex:none}
input[type=color].cp::-webkit-color-swatch-wrapper{padding:0}
input[type=color].cp::-webkit-color-swatch{border:0;border-radius:6px}
.st-n{font-size:11.5px;color:var(--rsub)}
.st-v{font:600 24px/1.15 "Space Grotesk",Inter,sans-serif;font-variant-numeric:tabular-nums}
.pg{height:8px;border-radius:8px;background:var(--rfield);overflow:hidden;display:flex;gap:3px}
.pg .fl{height:100%;background:var(--racc);border-radius:8px}
.pg .seg{flex:1;background:var(--rstroke);border-radius:3px}
.pg .seg.on{background:var(--racc)}
.pg.ind .fl{width:35%;animation:ind 1.1s ease-in-out infinite alternate}
@keyframes ind{from{transform:translateX(0)}to{transform:translateX(185%)}}
.cs{margin:0;background:var(--rfield);border:1px solid var(--rstroke);border-radius:8px;padding:8px 10px;font:12px/1.5 "JetBrains Mono",ui-monospace,monospace;color:var(--rtext);overflow:auto;white-space:pre-wrap;word-break:break-word}
.bare{display:flex;align-items:center;gap:10px;color:var(--rsub);font-size:11.5px;cursor:pointer;border-radius:8px;min-width:0;transition:transform .18s cubic-bezier(.2,.8,.2,1),color .18s ease}
.bare:hover{color:var(--rtext)}
.bare.sec{text-transform:uppercase;letter-spacing:.09em;font-weight:600;padding:6px 2px 0}
.bare .ln{flex:1;height:1px;background:var(--rstroke)}

/* ---- consola del builder ---- */
.con{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;position:sticky;top:12px;height:var(--preview-height);min-width:0}
.con,.con *{scrollbar-width:none;-ms-overflow-style:none}
.con::-webkit-scrollbar,.con *::-webkit-scrollbar{display:none}
.con-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;font:500 12px "JetBrains Mono",ui-monospace,monospace;color:var(--mut)}
.con-bar i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.modes{position:relative;isolation:isolate;display:flex;gap:4px;margin:5px 8px 0;padding:4px;border:1px solid var(--line);border-radius:13px;background:var(--field);overflow-x:auto}
.mode-indicator{position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:0;border:1px solid var(--accent);border-radius:9px;background:var(--accent);box-shadow:0 3px 9px var(--accent-soft);pointer-events:none;transition:transform .46s cubic-bezier(.34,1.28,.55,1),width .28s ease}
.modes:not(.ready) .mode-indicator{transition:none}
.mode{position:relative;z-index:1;flex:0 0 auto;border:1px solid transparent;background:transparent;color:var(--mut);padding:7px 11px;font-size:12.5px;font-weight:600;border-radius:9px;white-space:nowrap}
.mode:not(.on):hover{color:var(--accent);background:var(--accent-soft)}
.mode.on{color:var(--accent-fg);border-color:transparent;background:transparent;box-shadow:none}
.badge{display:inline-block;min-width:17px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font-size:10.5px;line-height:17px;text-align:center}
.con-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;min-height:0}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--mut);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;box-shadow:0 1px 3px rgba(10,20,40,.06)}
.chip.has-image{display:inline-flex;align-items:center;gap:7px}
.tab-image-row{margin-top:8px}
.tab-image-field{min-width:0}
.tab-image-controls{display:flex;align-items:center;gap:10px}
.tab-image-controls .in{flex:1}
.tab-image-label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px}
.tab-image-preview{width:48px;height:48px;flex:none;display:grid;place-items:center;overflow:hidden;border:1px dashed var(--line);border-radius:11px;background:var(--field);color:var(--mut);font-size:10px;text-align:center;padding:3px}
.tab-image-preview img{width:100%;height:100%;object-fit:contain;display:block}
.tab-image-id-preview{display:grid;justify-items:center;gap:2px;font-size:10px}
.tab-image-id-preview .ic{width:19px;height:19px;color:var(--accent)}
.tab-image-id-preview span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px}
.tab-image-hint,.tab-image-error{font-size:11px;line-height:1.35;margin-top:4px;color:var(--mut)}
.tab-image-error{color:var(--bad)}
.chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:650;box-shadow:0 3px 9px var(--accent-soft)}
.chip.add{border-style:dashed;background:transparent;color:var(--accent);box-shadow:none}
.frow{display:flex;gap:8px;margin-top:8px}
.in{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--field);min-width:0}
textarea.in{resize:vertical;font:12.5px/1.5 "JetBrains Mono",ui-monospace,monospace;white-space:pre}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:6px}
.addb{text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,var(--panel),var(--panel2));display:flex;flex-direction:column;gap:3px;box-shadow:0 2px 6px rgba(10,20,40,.06),inset 0 1px 0 rgba(255,255,255,.62)}
.addb:hover{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 7px 16px var(--accent-soft),inset 0 1px 0 rgba(255,255,255,.55)}
.addb b{font-weight:650;font-size:13px;color:var(--fg)}
.addb:hover b{color:var(--accent)}
.addb span{font-size:11.5px;color:var(--mut);line-height:1.35}
.li{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 9px;border:1px solid var(--line);border-radius:9px;margin-bottom:5px;background:var(--panel2)}
.li.sel{border-color:var(--accent);background:var(--accent-soft)}
.li .go{flex:1;min-width:0;display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:4px 2px;border-radius:7px;color:var(--fg)}
.li .go:hover{color:var(--accent)}
.li .ty{font:500 10.5px "JetBrains Mono",ui-monospace,monospace;color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:1px 6px;flex:none}
.li .nmx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--mut);padding:0;line-height:1;font-size:13px;flex:none;box-shadow:0 1px 3px rgba(10,20,40,.07)}
.ib:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.fr{display:flex;flex-direction:column;gap:5px}
.fr.inline{flex-direction:row;align-items:center;justify-content:space-between}
.fr label{font-size:12px;color:var(--mut);font-weight:500}
.sig{font:12px "JetBrains Mono",ui-monospace,monospace;color:var(--mut)}
.tg{width:42px;height:24px;border-radius:22px;border:1px solid var(--line);background:var(--field);position:relative;padding:0;flex:none}
.tg i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--mut);transition:transform .15s}
.tg.on{background:var(--accent);border-color:var(--accent)}
.tg.on i{transform:translateX(18px);background:var(--accent-fg)}
.empty{color:var(--mut);text-align:center;padding:30px 12px;border:1px dashed var(--line);border-radius:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
pre.lua{margin:0;background:var(--code-bg);color:var(--code-fg);border-radius:10px;padding:12px;font:12.5px/1.6 "JetBrains Mono",ui-monospace,monospace;overflow:auto;tab-size:4;flex:1;min-height:0}

 input:{m:'CreateInput',args:'text',local:true,f:[NM,DS,F('value','f_text0','text'),F('placeholder','f_ph','text'),F('numeric','f_numeric','bool'),F('clearOnFocus','f_clear','bool'),CB],

 console:{m:'CreateConsole',args:'',local:true,f:[NM,DS,F('text','f_lines','list'),F('height','f_height','num'),F('follow','f_follow','bool'),F('maxLines','f_maxl','num')],

 text:{m:'CreateText',args:'',local:true,f:[F('name','f_title','text'),F('text','f_body','list')],

var ONBOARDING_KEYS=['welcomeTitle','welcomeBody','welcomeTutorial','welcomeLanguage','welcomeVersion','welcomeContinue','options','switchTitle','switchBody','cancel','switchYes','recommendTitle','recommendBody','tutorialBody'];
var ONBOARDING_TEXT={
 en:['Welcome to Rayfield Builder Gen 1/2!','What would you like to do before you start?','View tutorial','Change language','Choose version','Continue','Options','ARE YOU SURE YOU WANT TO SWITCH TO RAYFIELD?','All buttons and information here will be reset, and you will have to start over.','Cancel',"Yes, I'm sure.",'Version changed','Would you like to see the tutorial for this version?','First, use Create to add a Slider (10–100), Input, Toggle, and Button to one tab; do not create them in Lua. Select each control and paste its callback body into its Callback field. Add the shared demoState declaration once in the generated Lua, after CreateTab and before the controls. The Fly demo only prints values; it does not move a player.'],
 es:['¡Bienvenido a Rayfield Builder Gen 1/2!','¿Qué quieres hacer antes de empezar?','Ver tutorial','Cambiar idioma','Elegir versión','Continuar','Opciones','¿SEGURO QUE QUIERES CAMBIAR A RAYFIELD?','Se restablecerán todos los botones y la información; tendrás que empezar de nuevo.','Cancelar','Sí, estoy seguro.','Versión cambiada','¿Quieres ver el tutorial de esta versión?','Primero, en Crear, añade en una misma pestaña un Slider (10–100), un Input, un Toggle y un Button; no los crees con Lua. Selecciona cada control y pega el cuerpo de su callback en el campo Callback. Añade una sola vez la declaración de demoState en el Lua generado, después de CreateTab y antes de los controles. El ejemplo Fly solo imprime valores; no mueve a ningún jugador.'],
 ca:['Benvingut a Rayfield Builder Gen 1/2!','Què vols fer abans de començar?','Veure el tutorial','Canviar l’idioma','Triar la versió','Continuar','Opcions','SEGUR QUE VOLS CANVIAR A RAYFIELD?','Es restabliran tots els botons i la informació; hauràs de començar de nou.','Cancel·lar','Sí, n’estic segur.','Versió canviada','Vols veure el tutorial d’aquesta versió?','Primer, a Crear, afegeix en una mateixa pestanya un Slider (10–100), un Input, un Toggle i un Button; no els creïs amb Lua. Selecciona cada control i enganxa el cos del callback al camp corresponent. Afegeix una sola vegada demoState al Lua generat, després de CreateTab i abans dels controls. L’exemple Fly només imprimeix valors; no mou cap jugador.'],
 fr:['Bienvenue dans Rayfield Builder Gen 1/2 !','Que voulez-vous faire avant de commencer ?','Voir le tutoriel','Changer de langue','Choisir une version','Continuer','Options','VOULEZ-VOUS VRAIMENT PASSER À RAYFIELD ?','Tous les boutons et toutes les informations seront réinitialisés ; vous devrez recommencer.','Annuler','Oui, je confirme.','Version modifiée','Voulez-vous consulter le tutoriel de cette version ?','Dans Créer, ajoutez d’abord dans un même onglet un Slider (10–100), un Input, un Toggle et un Button ; ne les créez pas en Lua. Sélectionnez chaque contrôle et collez le corps du callback dans son champ Callback. Ajoutez une seule fois demoState dans le Lua généré, après CreateTab et avant les contrôles. L’exemple Fly affiche seulement des valeurs ; il ne déplace aucun joueur.'],
 de:['Willkommen bei Rayfield Builder Gen 1/2!','Was möchtest du vor dem Start tun?','Tutorial ansehen','Sprache ändern','Version auswählen','Weiter','Optionen','MÖCHTEST DU WIRKLICH ZU RAYFIELD WECHSELN?','Alle Schaltflächen und Informationen werden zurückgesetzt; du musst von vorn beginnen.','Abbrechen','Ja, ich bin sicher.','Version geändert','Möchtest du das Tutorial für diese Version ansehen?','Füge zuerst unter „Erstellen“ im selben Tab einen Slider (10–100), Input, Toggle und Button hinzu; erstelle sie nicht in Lua. Wähle jedes Steuerelement aus und füge den Callback-Inhalt in sein Callback-Feld ein. Ergänze demoState einmal im generierten Lua-Code nach CreateTab und vor den Steuerelementen. Das Fly-Beispiel gibt nur Werte aus und bewegt keinen Spieler.'],
 pt:['Bem-vindo ao Rayfield Builder Gen 1/2!','O que queres fazer antes de começar?','Ver tutorial','Alterar idioma','Escolher versão','Continuar','Opções','TEM A CERTEZA DE QUE QUER MUDAR PARA RAYFIELD?','Todos os botões e informações serão repostos; terá de começar de novo.','Cancelar','Sim, tenho a certeza.','Versão alterada','Quer ver o tutorial desta versão?','Em Criar, adiciona primeiro ao mesmo separador um Slider (10–100), um Input, um Toggle e um Button; não os cries em Lua. Seleciona cada controlo e cola o corpo do callback no respetivo campo Callback. Adiciona demoState uma só vez no Lua gerado, após CreateTab e antes dos controlos. O exemplo Fly apenas imprime valores; não move nenhum jogador.'],
 it:['Benvenuto in Rayfield Builder Gen 1/2!','Cosa vuoi fare prima di iniziare?','Visualizza il tutorial','Cambia lingua','Scegli versione','Continua','Opzioni','VUOI DAVVERO PASSARE A RAYFIELD?','Tutti i pulsanti e le informazioni verranno reimpostati; dovrai ricominciare.','Annulla','Sì, sono sicuro.','Versione modificata','Vuoi vedere il tutorial di questa versione?','In Crea, aggiungi prima nella stessa scheda uno Slider (10–100), un Input, un Toggle e un Button; non crearli in Lua. Seleziona ogni controllo e incolla il corpo del callback nel relativo campo Callback. Aggiungi demoState una sola volta nel Lua generato, dopo CreateTab e prima dei controlli. L’esempio Fly stampa solo valori; non sposta alcun giocatore.'],
 zh:['欢迎使用 Rayfield Builder Gen 1/2！','开始之前，你想做什么？','查看教程','更改语言','选择版本','继续','选项','确定要切换到 Rayfield 吗？','所有按钮和信息都会被重置，你需要从头开始。','取消','是的，我确定。','版本已更改','要查看此版本的教程吗？','先在“创建”中为同一个标签页添加 Slider（10–100）、Input、Toggle 和 Button；不要用 Lua 创建它们。选择每个控件，把对应的 callback 内容粘贴到 Callback 字段。然后在生成的 Lua 中、CreateTab 之后和控件之前，只添加一次 demoState 声明。Fly 示例只会打印数值，不会移动玩家。'],
 ja:['Rayfield Builder Gen 1/2へようこそ！','開始する前に何をしますか？','チュートリアルを見る','言語を変更','バージョンを選択','続行','オプション','Rayfieldに切り替えてもよろしいですか？','ボタンと情報はすべてリセットされ、最初からやり直しになります。','キャンセル','はい、切り替えます。','バージョンを変更しました','このバージョンのチュートリアルを見ますか？','まず「作成」で同じタブに Slider（10～100）、Input、Toggle、Button を追加します。Luaで作成する必要はありません。各コントロールを選び、対応するcallback本文をCallback欄に貼り付けます。生成されたLuaではCreateTabの後、コントロールの前にdemoStateを一度だけ追加します。Flyの例は値を表示するだけで、プレイヤーを動かしません。'],
 ko:['Rayfield Builder Gen 1/2에 오신 것을 환영합니다!','시작하기 전에 무엇을 하시겠어요?','튜토리얼 보기','언어 변경','버전 선택','계속','옵션','Rayfield로 전환하시겠습니까?','모든 버튼과 정보가 초기화되어 처음부터 다시 시작해야 합니다.','취소','네, 전환하겠습니다.','버전 변경됨','이 버전의 튜토리얼을 보시겠어요?','먼저 만들기에서 같은 탭에 Slider(10–100), Input, Toggle, Button을 추가하세요. Lua로 만들지 않습니다. 각 컨트롤을 선택해 해당 callback 본문을 Callback 필드에 붙여 넣으세요. 생성된 Lua에서 CreateTab 뒤, 컨트롤 앞에 demoState 선언을 한 번 추가하세요. Fly 예시는 값만 출력하며 플레이어를 움직이지 않습니다.'],
 ru:['Добро пожаловать в Rayfield Builder Gen 1/2!','Что вы хотите сделать перед началом?','Открыть руководство','Изменить язык','Выбрать версию','Продолжить','Параметры','ВЫ ДЕЙСТВИТЕЛЬНО ХОТИТЕ ПЕРЕЙТИ НА RAYFIELD?','Все кнопки и данные будут сброшены — придётся начать заново.','Отмена','Да, уверен.','Версия изменена','Хотите посмотреть руководство для этой версии?','Сначала в разделе «Создать» добавьте в одну вкладку Slider (10–100), Input, Toggle и Button; не создавайте их в Lua. Выберите каждый элемент и вставьте тело callback в поле Callback. В сгенерированном Lua добавьте demoState один раз после CreateTab и перед элементами. Пример Fly только выводит значения и не перемещает игрока.'],
 ar:['مرحبًا بك في Rayfield Builder Gen 1/2!','ماذا تريد أن تفعل قبل البدء؟','عرض البرنامج التعليمي','تغيير اللغة','اختيار الإصدار','متابعة','الخيارات','هل أنت متأكد من التبديل إلى Rayfield؟','ستتم إعادة ضبط جميع الأزرار والمعلومات، وسيتعين عليك البدء من جديد.','إلغاء','نعم، أنا متأكد.','تم تغيير الإصدار','هل تريد مشاهدة البرنامج التعليمي لهذا الإصدار؟','أولًا، أضف من «إنشاء» إلى علامة تبويب واحدة Slider (10–100) وInput وToggle وButton؛ لا تنشئها باستخدام Lua. اختر كل عنصر والصق محتوى callback في حقل Callback الخاص به. أضف demoState مرة واحدة في Lua المُنشأ، بعد CreateTab وقبل العناصر. مثال Fly يطبع القيم فقط ولا يحرّك أي لاعب.'],
 hi:['Rayfield Builder Gen 1/2 में आपका स्वागत है!','शुरू करने से पहले आप क्या करना चाहेंगे?','ट्यूटोरियल देखें','भाषा बदलें','संस्करण चुनें','जारी रखें','विकल्प','क्या आप वाकई Rayfield पर स्विच करना चाहते हैं?','सभी बटन और जानकारी रीसेट हो जाएंगे; आपको फिर से शुरू करना होगा।','रद्द करें','हाँ, मुझे यकीन है।','संस्करण बदल गया','क्या आप इस संस्करण का ट्यूटोरियल देखना चाहेंगे?','पहले बनाएँ में एक ही टैब पर Slider (10–100), Input, Toggle और Button जोड़ें; इन्हें Lua से न बनाएँ। हर कंट्रोल चुनकर उसका callback body Callback फ़ील्ड में चिपकाएँ। जनरेट किए गए Lua में CreateTab के बाद और कंट्रोल्स से पहले demoState को एक बार जोड़ें। Fly उदाहरण केवल मान प्रिंट करता है; खिलाड़ी को नहीं चलाता।'],
 bn:['Rayfield Builder Gen 1/2-এ স্বাগতম!','শুরু করার আগে আপনি কী করতে চান?','টিউটোরিয়াল দেখুন','ভাষা বদলান','সংস্করণ বেছে নিন','চালিয়ে যান','বিকল্প','আপনি কি সত্যিই Rayfield-এ যেতে চান?','সব বোতাম ও তথ্য মুছে যাবে; আপনাকে আবার শুরু করতে হবে।','বাতিল','হ্যাঁ, আমি নিশ্চিত।','সংস্করণ বদলেছে','এই সংস্করণের টিউটোরিয়াল দেখতে চান?','প্রথমে তৈরি অংশে একই ট্যাবে Slider (10–100), Input, Toggle এবং Button যোগ করুন; Lua দিয়ে এগুলো তৈরি করবেন না। প্রতিটি কন্ট্রোল বেছে নিয়ে তার callback-এর অংশ Callback ঘরে পেস্ট করুন। তৈরি Lua-তে CreateTab-এর পরে এবং কন্ট্রোলের আগে একবার demoState যোগ করুন। Fly উদাহরণটি শুধু মান দেখায়; খেলোয়াড়কে সরায় না।'],
 ur:['Rayfield Builder Gen 1/2 میں خوش آمدید!','شروع کرنے سے پہلے آپ کیا کرنا چاہیں گے؟','سبق دیکھیں','زبان تبدیل کریں','ورژن منتخب کریں','جاری رکھیں','اختیارات','کیا آپ واقعی Rayfield پر جانا چاہتے ہیں؟','تمام بٹن اور معلومات ری سیٹ ہو جائیں گی؛ آپ کو دوبارہ شروع کرنا ہوگا۔','منسوخ کریں','ہاں، مجھے یقین ہے۔','ورژن تبدیل ہوگیا','کیا آپ اس ورژن کا سبق دیکھنا چاہتے ہیں؟','پہلے بنائیں میں ایک ہی ٹیب پر Slider (10–100)، Input، Toggle اور Button شامل کریں؛ انہیں Lua سے نہ بنائیں۔ ہر کنٹرول منتخب کرکے اس کے callback کا متن Callback خانے میں چسپاں کریں۔ تیار کردہ Lua میں CreateTab کے بعد اور کنٹرولز سے پہلے demoState ایک بار شامل کریں۔ Fly مثال صرف اقدار دکھاتی ہے؛ کھلاڑی کو حرکت نہیں دیتی۔'],
 id:['Selamat datang di Rayfield Builder Gen 1/2!','Apa yang ingin Anda lakukan sebelum memulai?','Lihat tutorial','Ubah bahasa','Pilih versi','Lanjutkan','Opsi','YAKIN INGIN BERALIH KE RAYFIELD?','Semua tombol dan informasi akan diatur ulang; Anda harus memulai dari awal.','Batal','Ya, saya yakin.','Versi diubah','Ingin melihat tutorial untuk versi ini?','Pertama, di Buat tambahkan Slider (10–100), Input, Toggle, dan Button pada tab yang sama; jangan buat dengan Lua. Pilih setiap kontrol dan tempel isi callback ke kolom Callback. Di Lua yang dihasilkan, tambahkan demoState satu kali setelah CreateTab dan sebelum kontrol. Contoh Fly hanya mencetak nilai; tidak menggerakkan pemain.'],
 tr:['Rayfield Builder Gen 1/2’ye hoş geldiniz!','Başlamadan önce ne yapmak istersiniz?','Eğitimi görüntüle','Dili değiştir','Sürüm seç','Devam et','Seçenekler','RAYFIELD’E GEÇMEK İSTEDİĞİNİZE EMİN MİSİNİZ?','Tüm düğmeler ve bilgiler sıfırlanacak; baştan başlamanız gerekecek.','İptal','Evet, eminim.','Sürüm değiştirildi','Bu sürümün eğitimini görmek ister misiniz?','Önce Oluştur bölümünde aynı sekmeye Slider (10–100), Input, Toggle ve Button ekleyin; bunları Lua ile oluşturmayın. Her kontrolü seçip callback gövdesini Callback alanına yapıştırın. Oluşturulan Lua kodunda CreateTab sonrasına ve kontrollerden öncesine demoState’i bir kez ekleyin. Fly örneği yalnızca değerleri yazdırır; oyuncuyu hareket ettirmez.'],
 vi:['Chào mừng đến với Rayfield Builder Gen 1/2!','Bạn muốn làm gì trước khi bắt đầu?','Xem hướng dẫn','Đổi ngôn ngữ','Chọn phiên bản','Tiếp tục','Tùy chọn','BẠN CÓ CHẮC MUỐN CHUYỂN SANG RAYFIELD?','Tất cả nút và thông tin sẽ bị đặt lại; bạn phải bắt đầu lại.','Hủy','Vâng, tôi chắc chắn.','Đã đổi phiên bản','Bạn có muốn xem hướng dẫn cho phiên bản này không?','Trước tiên, trong Tạo, thêm Slider (10–100), Input, Toggle và Button vào cùng một tab; không tạo chúng bằng Lua. Chọn từng điều khiển và dán phần callback vào trường Callback. Trong Lua được tạo, thêm demoState một lần sau CreateTab và trước các điều khiển. Ví dụ Fly chỉ in giá trị, không di chuyển người chơi.'],
 te:['Rayfield Builder Gen 1/2కి స్వాగతం!','ప్రారంభించే ముందు మీరు ఏమి చేయాలనుకుంటున్నారు?','ట్యుటోరియల్ చూడండి','భాష మార్చండి','వెర్షన్ ఎంచుకోండి','కొనసాగించండి','ఎంపికలు','Rayfield‌కు మారాలని ఖచ్చితంగా అనుకుంటున్నారా?','అన్ని బటన్లు, సమాచారం రీసెట్ అవుతాయి; మళ్లీ మొదటి నుంచి ప్రారంభించాలి.','రద్దు','అవును, నాకు ఖచ్చితంగా తెలుసు.','వెర్షన్ మార్చబడింది','ఈ వెర్షన్ ట్యుటోరియల్ చూడాలనుకుంటున్నారా?','ముందుగా సృష్టించు విభాగంలో ఒకే ట్యాబ్‌కు Slider (10–100), Input, Toggle, Button జోడించండి; వాటిని Luaతో సృష్టించవద్దు. ప్రతి కంట్రోల్‌ను ఎంచుకుని దాని callback భాగాన్ని Callback ఫీల్డ్‌లో పెట్టండి. రూపొందించిన Luaలో CreateTab తర్వాత, కంట్రోల్‌లకు ముందు demoStateను ఒక్కసారి జోడించండి. Fly ఉదాహరణ విలువలను మాత్రమే ముద్రిస్తుంది; ప్లేయర్‌ను కదిలించదు.'],
 mr:['Rayfield Builder Gen 1/2 मध्ये आपले स्वागत आहे!','सुरू करण्यापूर्वी तुम्हाला काय करायचे आहे?','ट्युटोरियल पहा','भाषा बदला','आवृत्ती निवडा','पुढे जा','पर्याय','तुम्हाला खरोखर Rayfield वर जायचे आहे का?','सर्व बटणे आणि माहिती रीसेट होतील; तुम्हाला पुन्हा सुरुवात करावी लागेल.','रद्द करा','हो, मला खात्री आहे.','आवृत्ती बदलली','या आवृत्तीचे ट्युटोरियल पाहायचे आहे का?','प्रथम तयार करा मध्ये एकाच टॅबवर Slider (10–100), Input, Toggle आणि Button जोडा; ते Lua मध्ये तयार करू नका. प्रत्येक कंट्रोल निवडून त्याचा callback मजकूर Callback क्षेत्रात पेस्ट करा. तयार Lua मध्ये CreateTab नंतर आणि कंट्रोल्सच्या आधी demoState एकदाच जोडा. Fly उदाहरण फक्त मूल्ये छापते; खेळाडूला हलवत नाही.'],
 ta:['Rayfield Builder Gen 1/2-க்கு வரவேற்கிறோம்!','தொடங்குவதற்கு முன் என்ன செய்ய விரும்புகிறீர்கள்?','வழிகாட்டியைப் பார்க்கவும்','மொழியை மாற்றவும்','பதிப்பைத் தேர்ந்தெடுக்கவும்','தொடரவும்','விருப்பங்கள்','Rayfield-க்கு மாற விரும்புகிறீர்களா?','அனைத்து பொத்தான்களும் தகவல்களும் மீட்டமைக்கப்படும்; மீண்டும் தொடங்க வேண்டும்.','ரத்துசெய்','ஆம், உறுதியாக இருக்கிறேன்.','பதிப்பு மாற்றப்பட்டது','இந்தப் பதிப்புக்கான வழிகாட்டியைப் பார்க்க விரும்புகிறீர்களா?','முதலில் உருவாக்கு பகுதியில் ஒரே தாவலில் Slider (10–100), Input, Toggle, Button சேர்க்கவும்; அவற்றை Lua-வில் உருவாக்க வேண்டாம். ஒவ்வொரு கட்டுப்பாட்டையும் தேர்ந்தெடுத்து callback உரையை Callback புலத்தில் ஒட்டவும். உருவாக்கிய Lua-வில் CreateTab-க்கு பிறகு, கட்டுப்பாடுகளுக்கு முன் demoState-ஐ ஒருமுறை சேர்க்கவும். Fly எடுத்துக்காட்டு மதிப்புகளை மட்டும் அச்சிடும்; வீரரை நகர்த்தாது.'],
 pa:['Rayfield Builder Gen 1/2 ਵਿੱਚ ਤੁਹਾਡਾ ਸੁਆਗਤ ਹੈ!','ਸ਼ੁਰੂ ਕਰਨ ਤੋਂ ਪਹਿਲਾਂ ਤੁਸੀਂ ਕੀ ਕਰਨਾ ਚਾਹੁੰਦੇ ਹੋ?','ਟਿਊਟੋਰਿਅਲ ਵੇਖੋ','ਭਾਸ਼ਾ ਬਦਲੋ','ਵਰਜਨ ਚੁਣੋ','ਜਾਰੀ ਰੱਖੋ','ਵਿਕਲਪ','ਕੀ ਤੁਸੀਂ ਵਾਕਈ Rayfield ’ਤੇ ਜਾਣਾ ਚਾਹੁੰਦੇ ਹੋ?','ਸਾਰੇ ਬਟਨ ਅਤੇ ਜਾਣਕਾਰੀ ਰੀਸੈੱਟ ਹੋ ਜਾਣਗੇ; ਤੁਹਾਨੂੰ ਮੁੜ ਸ਼ੁਰੂ ਕਰਨਾ ਪਵੇਗਾ।','ਰੱਦ ਕਰੋ','ਹਾਂ, ਮੈਨੂੰ ਯਕੀਨ ਹੈ।','ਵਰਜਨ ਬਦਲਿਆ','ਕੀ ਤੁਸੀਂ ਇਸ ਵਰਜਨ ਦਾ ਟਿਊਟੋਰਿਅਲ ਵੇਖਣਾ ਚਾਹੁੰਦੇ ਹੋ?','ਪਹਿਲਾਂ ਬਣਾਓ ਵਿੱਚ ਇੱਕੋ ਟੈਬ ਉੱਤੇ Slider (10–100), Input, Toggle ਅਤੇ Button ਜੋੜੋ; ਇਹਨਾਂ ਨੂੰ Lua ਨਾਲ ਨਾ ਬਣਾਓ। ਹਰ ਕੰਟਰੋਲ ਚੁਣ ਕੇ callback ਦਾ ਹਿੱਸਾ Callback ਖੇਤਰ ਵਿੱਚ ਪੇਸਟ ਕਰੋ। ਬਣੇ Lua ਵਿੱਚ CreateTab ਤੋਂ ਬਾਅਦ ਅਤੇ ਕੰਟਰੋਲਾਂ ਤੋਂ ਪਹਿਲਾਂ demoState ਇੱਕ ਵਾਰ ਜੋੜੋ। Fly ਉਦਾਹਰਨ ਸਿਰਫ਼ ਮੁੱਲ ਛਾਪਦੀ ਹੈ; ਖਿਡਾਰੀ ਨੂੰ ਨਹੀਂ ਹਿਲਾਉਂਦੀ।'],
 eu:['Ongi etorri Rayfield Builder Gen 1/2ra!','Zer egin nahi duzu hasi aurretik?','Ikusi tutoriala','Aldatu hizkuntza','Aukeratu bertsioa','Jarraitu','Aukerak','ZIUR ZAude RAYFIELD-ERA ALDATU NAHI DUZULA?','Botoi eta informazio guztiak berrezarriko dira; hutsetik hasi beharko duzu.','Utzi','Bai, ziur nago.','Bertsioa aldatu da','Bertsio honen tutoriala ikusi nahi duzu?','Lehenik, Sortu atalean gehitu Slider (10–100), Input, Toggle eta Button fitxa berean; ez sortu Lua erabiliz. Hautatu kontrol bakoitza eta itsatsi callback-aren gorputza Callback eremuan. Sortutako Lua-n, gehitu demoState behin CreateTab-en ondoren eta kontrolen aurretik. Fly adibideak balioak soilik inprimatzen ditu; ez du jokalaria mugitzen.'],
 sw:['Karibu kwenye Rayfield Builder Gen 1/2!','Ungependa kufanya nini kabla ya kuanza?','Tazama mafunzo','Badilisha lugha','Chagua toleo','Endelea','Chaguo','UNAHAKIKA UNATAKA KUBADILISHA KUWA RAYFIELD?','Vifungo na maelezo yote yatawekwa upya; utahitaji kuanza tena.','Ghairi','Ndiyo, nina uhakika.','Toleo limebadilishwa','Je, ungependa kuona mafunzo ya toleo hili?','Kwanza, katika Unda ongeza Slider (10–100), Input, Toggle na Button kwenye kichupo kimoja; usiviumbe kwa Lua. Chagua kila kidhibiti na ubandike sehemu ya callback kwenye sehemu ya Callback. Kwenye Lua iliyozalishwa, ongeza demoState mara moja baada ya CreateTab na kabla ya vidhibiti. Mfano wa Fly huchapisha thamani tu; haumhamishi mchezaji.'],
 ha:['Barka da zuwa Rayfield Builder Gen 1/2!','Me kake son yi kafin ka fara?','Duba koyarwa','Canja harshe','Zaɓi siga','Ci gaba','Zaɓuɓɓuka','KA TABBATA KANA SON CANJAWA ZUWA RAYFIELD?','Za a sake saita duk maɓallai da bayanai; sai ka fara daga farko.','Soke','Eh, na tabbata.','An canja siga','Kana son duba koyarwar wannan sigar?','Da farko, a Ƙirƙira ƙara Slider (10–100), Input, Toggle da Button a shafi ɗaya; kada ka ƙirƙire su da Lua. Zaɓi kowane sarrafawa ka manna ɓangaren callback a filin Callback. A cikin Lua da aka samar, ƙara demoState sau ɗaya bayan CreateTab kuma kafin sarrafawa. Misalin Fly yana buga ƙimomi kawai; ba ya motsa ɗan wasa.']
};
ONBOARDING_KEYS.forEach(function(k,i){LANGS.forEach(function(l){if(D[l[0]])D[l[0]][k]=ONBOARDING_TEXT[l[0]][i];});});
var TUTORIAL_SEQUENCE_TEXT={
 en:[
  '1. Create Slider: In Create, add a Slider named Fly demo speed to the demo tab. Set its range to 10–100, increment to 1, and initial value to 50.',
  '2. Slider callback: Add the shared setup block below once in generated Lua after CreateTab and before the controls. Then paste only the Slider callback block into its Callback field; it saves a rounded, validated speed.',
  '3. Create Input: In Create, add an Input named Speed input to the same tab.',
  '4. Input callback: Paste this into the Input Callback field. It parses and validates the text before updating the same shared speed.',
  '5. Create Toggle: In Create, add a Toggle named Enable demo and leave it off initially.',
  '6. Toggle callback: Paste this into the Toggle Callback field. It stores whether the demo is enabled.',
  '7. Create Button: In Create, add a Button named Print demo settings.',
  '8. Button callback: Paste this into the Button Callback field. It checks the toggle and prints the speed; it does not perform a Fly action.'
 ],
 es:[
  '1. Crear Slider: En Crear, añade a la pestaña del demo un Slider llamado Fly demo speed. Pon el rango en 10–100, el incremento en 1 y el valor inicial en 50.',
  '2. Código del Slider: Añade una sola vez el bloque de estado de abajo al Lua generado, después de CreateTab y antes de los controles. Luego pega solo el bloque del callback del Slider en su campo Callback; guarda una velocidad validada y redondeada.',
  '3. Crear Input: En Crear, añade a la misma pestaña un Input llamado Speed input.',
  '4. Código del Input: Pega esto en el campo Callback del Input. Convierte y valida el texto antes de actualizar la misma velocidad compartida.',
  '5. Crear Toggle: En Crear, añade un Toggle llamado Enable demo y déjalo desactivado inicialmente.',
  '6. Código del Toggle: Pega esto en el campo Callback del Toggle. Guarda si la demostración está habilitada.',
  '7. Crear Button: En Crear, añade un Button llamado Print demo settings.',
  '8. Código del Button: Pega esto en el campo Callback del Button. Comprueba el Toggle e imprime la velocidad; no ejecuta ninguna acción de vuelo.'
 ],
 ca:[
  '1. Crear Slider: A Crear, afegeix a la pestanya de demostració un Slider anomenat Fly demo speed. Defineix el rang 10–100, l’increment 1 i el valor inicial 50.',
  '2. Codi del Slider: Afegeix una sola vegada el bloc d’estat de sota al Lua generat, després de CreateTab i abans dels controls. Després enganxa només el bloc del callback del Slider al camp Callback; desa una velocitat validada i arrodonida.',
  '3. Crear Input: A Crear, afegeix a la mateixa pestanya un Input anomenat Speed input.',
  '4. Codi de l’Input: Enganxa això al camp Callback de l’Input. Converteix i valida el text abans d’actualitzar la mateixa velocitat compartida.',
  '5. Crear Toggle: A Crear, afegeix un Toggle anomenat Enable demo i deixa’l desactivat inicialment.',
  '6. Codi del Toggle: Enganxa això al camp Callback del Toggle. Desa si la demostració està activada.',
  '7. Crear Button: A Crear, afegeix un Button anomenat Print demo settings.',
  '8. Codi del Button: Enganxa això al camp Callback del Button. Comprova el Toggle i imprimeix la velocitat; no executa cap acció de vol.'
 ],
 fr:[
  '1. Créer le Slider : Dans Créer, ajoutez à l’onglet de démo un Slider nommé Fly demo speed. Réglez la plage sur 10–100, le pas sur 1 et la valeur initiale sur 50.',
  '2. Code du Slider : Ajoutez une seule fois le bloc d’état ci-dessous au Lua généré, après CreateTab et avant les contrôles. Collez ensuite uniquement le callback du Slider dans son champ Callback ; il enregistre une vitesse validée et arrondie.',
  '3. Créer l’Input : Dans Créer, ajoutez à ce même onglet un Input nommé Speed input.',
  '4. Code de l’Input : Collez ceci dans le champ Callback de l’Input. Le texte est converti et vérifié avant de mettre à jour la vitesse partagée.',
  '5. Créer le Toggle : Dans Créer, ajoutez un Toggle nommé Enable demo et laissez-le désactivé au départ.',
  '6. Code du Toggle : Collez ceci dans le champ Callback du Toggle. Il mémorise si la démo est activée.',
  '7. Créer le Button : Dans Créer, ajoutez un Button nommé Print demo settings.',
  '8. Code du Button : Collez ceci dans le champ Callback du Button. Il vérifie le Toggle et affiche la vitesse ; il ne déclenche aucune action de vol.'
 ],
 de:[
  '1. Slider erstellen: Füge unter „Erstellen“ im Demo-Tab einen Slider namens Fly demo speed hinzu. Bereich: 10–100, Schrittweite: 1, Startwert: 50.',
  '2. Slider-Code: Füge den Zustandsblock unten einmalig im generierten Lua nach CreateTab und vor den Steuerelementen ein. Füge dann nur den Slider-Callback in sein Callback-Feld ein; er speichert eine geprüfte, gerundete Geschwindigkeit.',
  '3. Input erstellen: Füge unter „Erstellen“ im selben Tab einen Input namens Speed input hinzu.',
  '4. Input-Code: Füge dies in das Callback-Feld des Inputs ein. Der Text wird geprüft und umgewandelt, bevor derselbe gemeinsame Geschwindigkeitswert aktualisiert wird.',
  '5. Toggle erstellen: Füge unter „Erstellen“ einen Toggle namens Enable demo hinzu und lasse ihn zunächst ausgeschaltet.',
  '6. Toggle-Code: Füge dies in das Callback-Feld des Toggles ein. Es speichert, ob die Demo aktiviert ist.',
  '7. Button erstellen: Füge unter „Erstellen“ einen Button namens Print demo settings hinzu.',
  '8. Button-Code: Füge dies in das Callback-Feld des Buttons ein. Er prüft den Toggle und gibt die Geschwindigkeit aus; eine Flugaktion wird nicht ausgeführt.'
 ],
 pt:[
  '1. Criar Slider: Em Criar, adiciona ao separador da demonstração um Slider chamado Fly demo speed. Define o intervalo 10–100, incremento 1 e valor inicial 50.',
  '2. Código do Slider: Adiciona uma vez o bloco de estado abaixo ao Lua gerado, depois de CreateTab e antes dos controlos. Depois cola apenas o callback do Slider no campo Callback; guarda uma velocidade validada e arredondada.',
  '3. Criar Input: Em Criar, adiciona um Input chamado Speed input ao mesmo separador.',
  '4. Código do Input: Cola isto no campo Callback do Input. Converte e valida o texto antes de atualizar a mesma velocidade partilhada.',
  '5. Criar Toggle: Em Criar, adiciona um Toggle chamado Enable demo e deixa-o desligado inicialmente.',
  '6. Código do Toggle: Cola isto no campo Callback do Toggle. Guarda se a demonstração está ativa.',
  '7. Criar Button: Em Criar, adiciona um Button chamado Print demo settings.',
  '8. Código do Button: Cola isto no campo Callback do Button. Verifica o Toggle e imprime a velocidade; não executa nenhuma ação de voo.'
 ],
 it:[
  '1. Crea Slider: In Crea, aggiungi alla scheda demo uno Slider chiamato Fly demo speed. Imposta intervallo 10–100, incremento 1 e valore iniziale 50.',
  '2. Codice Slider: Aggiungi una sola volta il blocco di stato qui sotto al Lua generato, dopo CreateTab e prima dei controlli. Poi incolla solo il callback dello Slider nel campo Callback; salva una velocità convalidata e arrotondata.',
  '3. Crea Input: In Crea, aggiungi alla stessa scheda un Input chiamato Speed input.',
  '4. Codice Input: Incolla questo nel campo Callback dell’Input. Converte e convalida il testo prima di aggiornare la stessa velocità condivisa.',
  '5. Crea Toggle: In Crea, aggiungi un Toggle chiamato Enable demo e lascialo disattivato inizialmente.',
  '6. Codice Toggle: Incolla questo nel campo Callback del Toggle. Memorizza se la demo è attiva.',
  '7. Crea Button: In Crea, aggiungi un Button chiamato Print demo settings.',
  '8. Codice Button: Incolla questo nel campo Callback del Button. Controlla il Toggle e stampa la velocità; non esegue azioni di volo.'
 ],
 zh:[
  '1. 创建 Slider：在“创建”中为演示标签页添加名为 Fly demo speed 的 Slider。范围设为 10–100，步长设为 1，初始值设为 50。',
  '2. Slider 回调代码：将下面的共享状态代码只添加一次到生成的 Lua 中，位置在 CreateTab 之后、控件之前。然后只把 Slider 回调代码粘贴到它的 Callback 字段；它会保存经过验证和取整的速度。',
  '3. 创建 Input：在“创建”中为同一标签页添加名为 Speed input 的 Input。',
  '4. Input 回调代码：将此代码粘贴到 Input 的 Callback 字段。它会转换并验证文本，再更新共享速度。',
  '5. 创建 Toggle：在“创建”中添加名为 Enable demo 的 Toggle，并让它初始关闭。',
  '6. Toggle 回调代码：将此代码粘贴到 Toggle 的 Callback 字段。它会保存演示是否启用。',
  '7. 创建 Button：在“创建”中添加名为 Print demo settings 的 Button。',
  '8. Button 回调代码：将此代码粘贴到 Button 的 Callback 字段。它会检查 Toggle 并打印速度，不会执行飞行操作。'
 ],
 ja:[
  '1. Slider を作成：作成画面でデモ用タブに Fly demo speed という Slider を追加します。範囲は10～100、増分は1、初期値は50にします。',
  '2. Slider のコード：下の共有状態コードを、生成されたLuaのCreateTabの後、コントロールより前に一度だけ追加します。その後、SliderのCallback欄にはコールバック部分だけを貼り付けます。値を検証して丸めて保存します。',
  '3. Input を作成：作成画面で同じタブに Speed input というInputを追加します。',
  '4. Input のコード：このコードをInputのCallback欄に貼り付けます。入力文字を数値に変換して検証し、共有速度を更新します。',
  '5. Toggle を作成：作成画面で Enable demo というToggleを追加し、初期状態はオフにします。',
  '6. Toggle のコード：このコードをToggleのCallback欄に貼り付けます。デモが有効かどうかを保存します。',
  '7. Button を作成：作成画面で Print demo settings というButtonを追加します。',
  '8. Button のコード：このコードをButtonのCallback欄に貼り付けます。Toggleを確認して速度を表示するだけで、飛行動作は行いません。'
 ],
 ko:[
  '1. Slider 만들기: 만들기에서 데모 탭에 Fly demo speed라는 Slider를 추가하세요. 범위는 10–100, 증가량은 1, 초기값은 50으로 설정합니다.',
  '2. Slider 코드: 아래 공유 상태 코드를 생성된 Lua의 CreateTab 다음, 컨트롤 앞에 한 번만 추가하세요. 그런 다음 Slider의 Callback 필드에는 callback 부분만 붙여 넣으세요. 검증 후 반올림한 속도를 저장합니다.',
  '3. Input 만들기: 만들기에서 같은 탭에 Speed input이라는 Input을 추가하세요.',
  '4. Input 코드: 이 코드를 Input의 Callback 필드에 붙여 넣으세요. 텍스트를 숫자로 변환하고 검증한 다음 공유 속도를 갱신합니다.',
  '5. Toggle 만들기: 만들기에서 Enable demo라는 Toggle을 추가하고 처음에는 끄세요.',
  '6. Toggle 코드: 이 코드를 Toggle의 Callback 필드에 붙여 넣으세요. 데모 활성화 상태를 저장합니다.',
  '7. Button 만들기: 만들기에서 Print demo settings라는 Button을 추가하세요.',
  '8. Button 코드: 이 코드를 Button의 Callback 필드에 붙여 넣으세요. Toggle을 확인하고 속도만 출력하며 비행 동작은 하지 않습니다.'
 ],
 ru:[
  '1. Создайте Slider: в разделе «Создать» добавьте во вкладку демо Slider Fly demo speed. Установите диапазон 10–100, шаг 1 и начальное значение 50.',
  '2. Код Slider: один раз добавьте блок состояния ниже в сгенерированный Lua после CreateTab и перед элементами. Затем вставьте только callback Slider в поле Callback; он сохраняет проверенную и округлённую скорость.',
  '3. Создайте Input: в разделе «Создать» добавьте во вкладку Input с именем Speed input.',
  '4. Код Input: вставьте это в поле Callback элемента Input. Текст преобразуется и проверяется перед обновлением общей скорости.',
  '5. Создайте Toggle: в разделе «Создать» добавьте Toggle Enable demo и оставьте его выключенным.',
  '6. Код Toggle: вставьте это в поле Callback элемента Toggle. Оно сохраняет состояние включения демо.',
  '7. Создайте Button: в разделе «Создать» добавьте Button Print demo settings.',
  '8. Код Button: вставьте это в поле Callback кнопки. Она проверяет Toggle и выводит скорость; полёт не выполняется.'
 ],
 ar:[
  '1. أنشئ Slider: من «إنشاء»، أضف إلى تبويب العرض Slider باسم Fly demo speed. اضبط النطاق على 10–100 والزيادة على 1 والقيمة الأولية على 50.',
  '2. كود Slider: أضف كتلة الحالة أدناه مرة واحدة إلى Lua المُنشأ بعد CreateTab وقبل عناصر التحكم. ثم الصق كتلة callback الخاصة بـ Slider فقط في حقل Callback؛ فهي تحفظ سرعة متحققًا منها ومقربة.',
  '3. أنشئ Input: من «إنشاء»، أضف إلى التبويب نفسه Input باسم Speed input.',
  '4. كود Input: الصق هذا في حقل Callback لـ Input. يحول النص ويتحقق منه قبل تحديث السرعة المشتركة.',
  '5. أنشئ Toggle: من «إنشاء»، أضف Toggle باسم Enable demo واتركه متوقفًا أولًا.',
  '6. كود Toggle: الصق هذا في حقل Callback لـ Toggle. يحفظ حالة تفعيل العرض.',
  '7. أنشئ Button: من «إنشاء»، أضف Button باسم Print demo settings.',
  '8. كود Button: الصق هذا في حقل Callback للزر. يتحقق من Toggle ويطبع السرعة فقط، ولا ينفذ حركة طيران.'
 ],
 hi:[
  '1. Slider बनाएँ: बनाएँ में डेमो टैब पर Fly demo speed नाम का Slider जोड़ें। सीमा 10–100, increment 1 और शुरुआती मान 50 रखें।',
  '2. Slider का कोड: नीचे दिया साझा state block, जनरेट किए गए Lua में CreateTab के बाद और कंट्रोल्स से पहले केवल एक बार जोड़ें। फिर Slider के Callback फ़ील्ड में सिर्फ callback कोड पेस्ट करें; यह जाँची और गोल की हुई speed सहेजता है।',
  '3. Input बनाएँ: बनाएँ में उसी टैब पर Speed input नाम का Input जोड़ें।',
  '4. Input का कोड: इसे Input के Callback फ़ील्ड में पेस्ट करें। यह साझा speed बदलने से पहले text को number में बदलकर जाँचता है।',
  '5. Toggle बनाएँ: बनाएँ में Enable demo नाम का Toggle जोड़ें और शुरुआत में इसे बंद रखें।',
  '6. Toggle का कोड: इसे Toggle के Callback फ़ील्ड में पेस्ट करें। यह demo चालू है या नहीं, वह सहेजता है।',
  '7. Button बनाएँ: बनाएँ में Print demo settings नाम का Button जोड़ें।',
  '8. Button का कोड: इसे Button के Callback फ़ील्ड में पेस्ट करें। यह Toggle जाँचकर speed प्रिंट करता है; उड़ने की क्रिया नहीं करता।'
 ],
 bn:[
  '1. Slider তৈরি করুন: তৈরি অংশে ডেমো ট্যাবে Fly demo speed নামে Slider যোগ করুন। সীমা 10–100, increment 1 এবং প্রাথমিক মান 50 দিন।',
  '2. Slider-এর কোড: নিচের শেয়ার করা state block তৈরি Lua-তে CreateTab-এর পরে এবং কন্ট্রোলের আগে একবার যোগ করুন। এরপর Slider-এর Callback ঘরে শুধু callback কোড পেস্ট করুন; এটি যাচাই করে গোল করা speed সংরক্ষণ করে।',
  '3. Input তৈরি করুন: তৈরি অংশে একই ট্যাবে Speed input নামে Input যোগ করুন।',
  '4. Input-এর কোড: এটি Input-এর Callback ঘরে পেস্ট করুন। শেয়ার করা speed আপডেট করার আগে এটি লেখা সংখ্যায় রূপান্তর করে যাচাই করে।',
  '5. Toggle তৈরি করুন: তৈরি অংশে Enable demo নামে Toggle যোগ করুন এবং শুরুতে বন্ধ রাখুন।',
  '6. Toggle-এর কোড: এটি Toggle-এর Callback ঘরে পেস্ট করুন। ডেমো চালু আছে কি না তা সংরক্ষণ করে।',
  '7. Button তৈরি করুন: তৈরি অংশে Print demo settings নামে Button যোগ করুন।',
  '8. Button-এর কোড: এটি Button-এর Callback ঘরে পেস্ট করুন। Toggle পরীক্ষা করে speed দেখায়; কোনো উড়ার কাজ করে না।'
 ],
 ur:[
  '1. Slider بنائیں: بنائیں میں ڈیمو ٹیب پر Fly demo speed نام کا Slider شامل کریں۔ حد 10–100، اضافہ 1 اور ابتدائی قدر 50 رکھیں۔',
  '2. Slider کا کوڈ: نیچے دیا گیا مشترک state block تیار کردہ Lua میں CreateTab کے بعد اور کنٹرولز سے پہلے صرف ایک بار شامل کریں۔ پھر Slider کے Callback خانے میں صرف callback کوڈ چسپاں کریں؛ یہ تصدیق شدہ اور گول کی ہوئی رفتار محفوظ کرتا ہے۔',
  '3. Input بنائیں: بنائیں میں اسی ٹیب پر Speed input نام کا Input شامل کریں۔',
  '4. Input کا کوڈ: اسے Input کے Callback خانے میں چسپاں کریں۔ مشترک رفتار بدلنے سے پہلے متن کو عدد میں تبدیل کرکے جانچتا ہے۔',
  '5. Toggle بنائیں: بنائیں میں Enable demo نام کا Toggle شامل کریں اور ابتدا میں اسے بند رکھیں۔',
  '6. Toggle کا کوڈ: اسے Toggle کے Callback خانے میں چسپاں کریں۔ یہ ڈیمو کے فعال ہونے کی حالت محفوظ کرتا ہے۔',
  '7. Button بنائیں: بنائیں میں Print demo settings نام کا Button شامل کریں۔',
  '8. Button کا کوڈ: اسے Button کے Callback خانے میں چسپاں کریں۔ یہ Toggle جانچ کر رفتار دکھاتا ہے؛ پرواز کی کوئی کارروائی نہیں کرتا۔'
 ],
 id:[
  '1. Buat Slider: Di Buat, tambahkan Slider bernama Fly demo speed ke tab demo. Atur rentang 10–100, increment 1, dan nilai awal 50.',
  '2. Kode Slider: Tambahkan blok state bersama di bawah sekali saja pada Lua hasil, setelah CreateTab dan sebelum kontrol. Lalu tempel hanya callback Slider ke kolom Callback; kode ini menyimpan speed yang divalidasi dan dibulatkan.',
  '3. Buat Input: Di Buat, tambahkan Input bernama Speed input ke tab yang sama.',
  '4. Kode Input: Tempel ini ke kolom Callback Input. Teks diubah dan divalidasi sebelum memperbarui speed bersama.',
  '5. Buat Toggle: Di Buat, tambahkan Toggle bernama Enable demo dan biarkan mati pada awalnya.',
  '6. Kode Toggle: Tempel ini ke kolom Callback Toggle. Kode ini menyimpan status demo.',
  '7. Buat Button: Di Buat, tambahkan Button bernama Print demo settings.',
  '8. Kode Button: Tempel ini ke kolom Callback Button. Kode ini memeriksa Toggle lalu mencetak speed; tidak menjalankan aksi terbang.'
 ],
 tr:[
  '1. Slider oluşturun: Oluştur bölümünde demo sekmesine Fly demo speed adlı bir Slider ekleyin. Aralığı 10–100, artışı 1 ve başlangıç değerini 50 yapın.',
  '2. Slider kodu: Aşağıdaki ortak durum bloğunu oluşturulan Lua koduna CreateTab sonrasında ve kontrollerden önce yalnızca bir kez ekleyin. Ardından yalnızca Slider callback kodunu Callback alanına yapıştırın; doğrulanmış ve yuvarlanmış hızı kaydeder.',
  '3. Input oluşturun: Oluştur bölümünde aynı sekmeye Speed input adlı bir Input ekleyin.',
  '4. Input kodu: Bunu Input Callback alanına yapıştırın. Ortak hızı güncellemeden önce metni sayıya dönüştürüp doğrular.',
  '5. Toggle oluşturun: Oluştur bölümünde Enable demo adlı bir Toggle ekleyin ve başlangıçta kapalı bırakın.',
  '6. Toggle kodu: Bunu Toggle Callback alanına yapıştırın. Demonun etkin olup olmadığını kaydeder.',
  '7. Button oluşturun: Oluştur bölümünde Print demo settings adlı bir Button ekleyin.',
  '8. Button kodu: Bunu Button Callback alanına yapıştırın. Toggle durumunu kontrol edip hızı yazdırır; uçuş eylemi gerçekleştirmez.'
 ],
 vi:[
  '1. Tạo Slider: Trong Tạo, thêm Slider tên Fly demo speed vào tab demo. Đặt phạm vi 10–100, bước tăng 1 và giá trị ban đầu 50.',
  '2. Mã Slider: Thêm khối trạng thái dùng chung bên dưới một lần vào Lua được tạo, sau CreateTab và trước các điều khiển. Sau đó chỉ dán callback của Slider vào trường Callback; nó lưu tốc độ đã kiểm tra và làm tròn.',
  '3. Tạo Input: Trong Tạo, thêm Input tên Speed input vào cùng tab.',
  '4. Mã Input: Dán nội dung này vào trường Callback của Input. Nó chuyển đổi và kiểm tra văn bản trước khi cập nhật tốc độ dùng chung.',
  '5. Tạo Toggle: Trong Tạo, thêm Toggle tên Enable demo và để tắt lúc đầu.',
  '6. Mã Toggle: Dán nội dung này vào trường Callback của Toggle. Nó lưu trạng thái bật demo.',
  '7. Tạo Button: Trong Tạo, thêm Button tên Print demo settings.',
  '8. Mã Button: Dán nội dung này vào trường Callback của Button. Nó kiểm tra Toggle rồi in tốc độ; không thực hiện hành động bay.'
 ],
 te:[
  '1. Slider సృష్టించండి: సృష్టించు విభాగంలో డెమో ట్యాబ్‌కు Fly demo speed అనే Slider జోడించండి. పరిధి 10–100, increment 1, ప్రారంభ విలువ 50గా పెట్టండి.',
  '2. Slider కోడ్: దిగువ shared state block‌ను రూపొందించిన Luaలో CreateTab తర్వాత, కంట్రోల్‌లకు ముందు ఒక్కసారి జోడించండి. తరువాత Slider Callback ఫీల్డ్‌లో callback కోడ్ మాత్రమే పెట్టండి; ఇది ధృవీకరించిన, రౌండ్ చేసిన వేగాన్ని భద్రపరుస్తుంది.',
  '3. Input సృష్టించండి: సృష్టించు విభాగంలో అదే ట్యాబ్‌కు Speed input అనే Input జోడించండి.',
  '4. Input కోడ్: దీన్ని Input Callback ఫీల్డ్‌లో పెట్టండి. shared వేగాన్ని మార్చే ముందు టెక్స్ట్‌ను సంఖ్యగా మార్చి ధృవీకరిస్తుంది.',
  '5. Toggle సృష్టించండి: సృష్టించు విభాగంలో Enable demo అనే Toggle జోడించి మొదట ఆఫ్‌లో ఉంచండి.',
  '6. Toggle కోడ్: దీన్ని Toggle Callback ఫీల్డ్‌లో పెట్టండి. డెమో ప్రారంభించబడిందా అనే స్థితిని భద్రపరుస్తుంది.',
  '7. Button సృష్టించండి: సృష్టించు విభాగంలో Print demo settings అనే Button జోడించండి.',
  '8. Button కోడ్: దీన్ని Button Callback ఫీల్డ్‌లో పెట్టండి. Toggle‌ను తనిఖీ చేసి వేగాన్ని మాత్రమే ముద్రిస్తుంది; ఎగిరే చర్య చేయదు.'
 ],
 mr:[
  '1. Slider तयार करा: तयार करा मध्ये डेमो टॅबवर Fly demo speed नावाचा Slider जोडा. श्रेणी 10–100, increment 1 आणि सुरुवातीचे मूल्य 50 ठेवा.',
  '2. Slider कोड: खालील सामायिक state block तयार केलेल्या Lua मध्ये CreateTab नंतर आणि कंट्रोलच्या आधी एकदाच जोडा. नंतर Slider च्या Callback क्षेत्रात फक्त callback कोड पेस्ट करा; तो तपासलेला व round केलेला वेग साठवतो.',
  '3. Input तयार करा: तयार करा मध्ये त्याच टॅबवर Speed input नावाचा Input जोडा.',
  '4. Input कोड: हा कोड Input च्या Callback क्षेत्रात पेस्ट करा. सामायिक वेग बदलण्यापूर्वी मजकूर संख्या म्हणून रूपांतरित करून तपासतो.',
  '5. Toggle तयार करा: तयार करा मध्ये Enable demo नावाचा Toggle जोडा आणि सुरुवातीला बंद ठेवा.',
  '6. Toggle कोड: हा कोड Toggle च्या Callback क्षेत्रात पेस्ट करा. डेमो सुरू आहे की नाही ते साठवतो.',
  '7. Button तयार करा: तयार करा मध्ये Print demo settings नावाचा Button जोडा.',
  '8. Button कोड: हा कोड Button च्या Callback क्षेत्रात पेस्ट करा. Toggle तपासून वेग छापतो; उडण्याची कृती करत नाही.'
 ],
 ta:[
  '1. Slider உருவாக்கவும்: உருவாக்கு பகுதியில் டெமோ தாவலில் Fly demo speed என்ற Slider சேர்க்கவும். வரம்பு 10–100, increment 1, தொடக்க மதிப்பு 50 என அமைக்கவும்.',
  '2. Slider குறியீடு: கீழே உள்ள பகிரப்பட்ட state block-ஐ உருவாக்கிய Lua-வில் CreateTab-க்கு பிறகு, கட்டுப்பாடுகளுக்கு முன் ஒருமுறை சேர்க்கவும். பின்னர் Slider-ன் Callback புலத்தில் callback குறியீட்டை மட்டும் ஒட்டவும்; அது சரிபார்த்த வேகத்தைச் சேமிக்கும்.',
  '3. Input உருவாக்கவும்: உருவாக்கு பகுதியில் அதே தாவலில் Speed input என்ற Input சேர்க்கவும்.',
  '4. Input குறியீடு: இதை Input-ன் Callback புலத்தில் ஒட்டவும். பகிரப்பட்ட வேகத்தைப் புதுப்பிக்கும் முன் உரையை எண்ணாக மாற்றிச் சரிபார்க்கிறது.',
  '5. Toggle உருவாக்கவும்: உருவாக்கு பகுதியில் Enable demo என்ற Toggle சேர்த்து தொடக்கத்தில் அணைக்கவும்.',
  '6. Toggle குறியீடு: இதை Toggle-ன் Callback புலத்தில் ஒட்டவும். டெமோ இயக்கப்பட்டுள்ளதா என்பதைச் சேமிக்கிறது.',
  '7. Button உருவாக்கவும்: உருவாக்கு பகுதியில் Print demo settings என்ற Button சேர்க்கவும்.',
  '8. Button குறியீடு: இதை Button-ன் Callback புலத்தில் ஒட்டவும். Toggle-ஐச் சரிபார்த்து வேகத்தை மட்டும் அச்சிடுகிறது; பறக்கும் செயலைச் செய்யாது.'
 ],
 pa:[
  '1. Slider ਬਣਾਓ: ਬਣਾਓ ਵਿੱਚ ਡੈਮੋ ਟੈਬ ਉੱਤੇ Fly demo speed ਨਾਮ ਦਾ Slider ਜੋੜੋ। ਰੇਂਜ 10–100, increment 1 ਅਤੇ ਸ਼ੁਰੂਆਤੀ ਮੁੱਲ 50 ਰੱਖੋ।',
  '2. Slider ਕੋਡ: ਹੇਠਾਂ ਦਿੱਤਾ ਸਾਂਝਾ state block ਬਣੇ Lua ਵਿੱਚ CreateTab ਤੋਂ ਬਾਅਦ ਅਤੇ ਕੰਟਰੋਲਾਂ ਤੋਂ ਪਹਿਲਾਂ ਇੱਕ ਵਾਰ ਜੋੜੋ। ਫਿਰ Slider ਦੇ Callback ਖੇਤਰ ਵਿੱਚ ਸਿਰਫ਼ callback ਕੋਡ ਪੇਸਟ ਕਰੋ; ਇਹ ਜਾਂਚਿਆ ਅਤੇ ਗੋਲ ਕੀਤਾ ਵੇਗ ਸੰਭਾਲਦਾ ਹੈ।',
  '3. Input ਬਣਾਓ: ਬਣਾਓ ਵਿੱਚ ਉਸੇ ਟੈਬ ਉੱਤੇ Speed input ਨਾਮ ਦਾ Input ਜੋੜੋ।',
  '4. Input ਕੋਡ: ਇਹ Input ਦੇ Callback ਖੇਤਰ ਵਿੱਚ ਪੇਸਟ ਕਰੋ। ਸਾਂਝਾ ਵੇਗ ਬਦਲਣ ਤੋਂ ਪਹਿਲਾਂ ਲਿਖਤ ਨੂੰ ਅੰਕ ਵਿੱਚ ਬਦਲ ਕੇ ਜਾਂਚਦਾ ਹੈ।',
  '5. Toggle ਬਣਾਓ: ਬਣਾਓ ਵਿੱਚ Enable demo ਨਾਮ ਦਾ Toggle ਜੋੜੋ ਅਤੇ ਸ਼ੁਰੂ ਵਿੱਚ ਬੰਦ ਰੱਖੋ।',
  '6. Toggle ਕੋਡ: ਇਹ Toggle ਦੇ Callback ਖੇਤਰ ਵਿੱਚ ਪੇਸਟ ਕਰੋ। ਇਹ ਡੈਮੋ ਚਾਲੂ ਹੋਣ ਦੀ ਸਥਿਤੀ ਸੰਭਾਲਦਾ ਹੈ।',
  '7. Button ਬਣਾਓ: ਬਣਾਓ ਵਿੱਚ Print demo settings ਨਾਮ ਦਾ Button ਜੋੜੋ।',
  '8. Button ਕੋਡ: ਇਹ Button ਦੇ Callback ਖੇਤਰ ਵਿੱਚ ਪੇਸਟ ਕਰੋ। Toggle ਜਾਂਚ ਕੇ ਵੇਗ ਛਾਪਦਾ ਹੈ; ਉੱਡਣ ਦੀ ਕਾਰਵਾਈ ਨਹੀਂ ਕਰਦਾ।'
 ],
 eu:[
  '1. Sortu Slider: Sortu atalean, gehitu Fly demo speed izeneko Slider bat demo-fitxan. Ezarri 10–100 tartea, 1eko gehikuntza eta 50eko hasierako balioa.',
  '2. Slider kodea: Gehitu beheko egoera-blokea behin bakarrik sortutako Lua-n, CreateTab-en ondoren eta kontrolen aurretik. Ondoren, itsatsi Slider-aren callback-a soilik haren Callback eremuan; balio egiaztatu eta biribildua gordetzen du.',
  '3. Sortu Input: Sortu atalean, gehitu Speed input izeneko Input bat fitxa berean.',
  '4. Input kodea: Itsatsi hau Input-aren Callback eremuan. Testua zenbaki bihurtu eta egiaztatzen du partekatutako abiadura eguneratu aurretik.',
  '5. Sortu Toggle: Sortu atalean, gehitu Enable demo izeneko Toggle bat eta utzi itzalita hasieran.',
  '6. Toggle kodea: Itsatsi hau Toggle-aren Callback eremuan. Demoa gaituta dagoen gordetzen du.',
  '7. Sortu Button: Sortu atalean, gehitu Print demo settings izeneko Button bat.',
  '8. Button kodea: Itsatsi hau Button-aren Callback eremuan. Toggle-a egiaztatu eta abiadura inprimatzen du; ez du hegaldi-ekintzarik egiten.'
 ],
 sw:[
  '1. Unda Slider: Katika Unda, ongeza Slider ya Fly demo speed kwenye kichupo cha demo. Weka masafa 10–100, ongezeko 1 na thamani ya mwanzo 50.',
  '2. Msimbo wa Slider: Ongeza kizuizi cha hali hapa chini mara moja kwenye Lua iliyozalishwa baada ya CreateTab na kabla ya vidhibiti. Kisha bandika callback ya Slider pekee kwenye sehemu yake ya Callback; huhifadhi kasi iliyothibitishwa na kuzungushwa.',
  '3. Unda Input: Katika Unda, ongeza Input ya Speed input kwenye kichupo hicho hicho.',
  '4. Msimbo wa Input: Bandika hii kwenye sehemu ya Callback ya Input. Hubadilisha na kuthibitisha maandishi kabla ya kusasisha kasi ya pamoja.',
  '5. Unda Toggle: Katika Unda, ongeza Toggle ya Enable demo na uiache ikiwa imezimwa mwanzoni.',
  '6. Msimbo wa Toggle: Bandika hii kwenye sehemu ya Callback ya Toggle. Huhifadhi ikiwa demo imewashwa.',
  '7. Unda Button: Katika Unda, ongeza Button ya Print demo settings.',
  '8. Msimbo wa Button: Bandika hii kwenye sehemu ya Callback ya Button. Hukagua Toggle na kuchapisha kasi tu; haifanyi kitendo cha kuruka.'
 ],
 ha:[
  '1. Ƙirƙiri Slider: A Ƙirƙira, ƙara Slider mai suna Fly demo speed a shafin demo. Saita iyaka 10–100, ƙarin mataki 1, da ƙimar farawa 50.',
  '2. Lambar Slider: Ƙara state block ɗin nan sau ɗaya a Lua da aka samar bayan CreateTab kuma kafin sarrafawa. Sannan manna callback ɗin Slider kaɗai a filin Callback; yana adana saurin da aka tantance kuma aka zagaye.',
  '3. Ƙirƙiri Input: A Ƙirƙira, ƙara Input mai suna Speed input a shafin ɗaya.',
  '4. Lambar Input: Manna wannan a filin Callback na Input. Yana canza rubutu zuwa lamba kuma ya tantance shi kafin sabunta saurin da aka raba.',
  '5. Ƙirƙiri Toggle: A Ƙirƙira, ƙara Toggle mai suna Enable demo kuma bar shi a kashe da farko.',
  '6. Lambar Toggle: Manna wannan a filin Callback na Toggle. Yana adana ko an kunna demo.',
  '7. Ƙirƙiri Button: A Ƙirƙira, ƙara Button mai suna Print demo settings.',
  '8. Lambar Button: Manna wannan a filin Callback na Button. Yana duba Toggle sannan ya buga sauri kawai; ba ya aiwatar da tashi.'
 ]
};
var TUTORIAL_TEXT={
 en:['Builder guide','Link controls','1. In Create, add tabs and controls. 2. Select a control to edit its label, values, and callback. 3. Adjust the window, then open Lua to review and copy the generated code. Preview interactions are simulated.'],
 es:['Guía del builder','Vincular controles','1. En Crear, añade pestañas y controles. 2. Selecciona un control para editar su nombre, valores y callback. 3. Ajusta la ventana y abre Lua para revisar y copiar el código. La vista previa solo simula las interacciones.'],
 ca:['Guia del builder','Enllaçar controls','1. A Crear, afegeix pestanyes i controls. 2. Selecciona un control per editar-ne el nom, els valors i el callback. 3. Ajusta la finestra i obre Lua per revisar i copiar el codi. La vista prèvia només simula les interaccions.'],
 fr:['Guide du builder','Lier les contrôles','1. Dans Créer, ajoutez des onglets et des contrôles. 2. Sélectionnez un contrôle pour modifier son nom, ses valeurs et son callback. 3. Réglez la fenêtre, puis ouvrez Lua pour vérifier et copier le code. L’aperçu simule les interactions.'],
 de:['Builder-Anleitung','Steuerelemente verknüpfen','1. Füge unter „Erstellen“ Tabs und Steuerelemente hinzu. 2. Wähle ein Steuerelement, um Namen, Werte und Callback zu bearbeiten. 3. Passe das Fenster an und prüfe und kopiere den Code unter Lua. Die Vorschau simuliert Interaktionen.'],
 pt:['Guia do builder','Ligar controlos','1. Em Criar, adiciona separadores e controlos. 2. Seleciona um controlo para editar o nome, os valores e o callback. 3. Ajusta a janela e abre Lua para rever e copiar o código. A pré-visualização apenas simula as interações.'],
 it:['Guida del builder','Collegare i controlli','1. In Crea, aggiungi schede e controlli. 2. Seleziona un controllo per modificarne nome, valori e callback. 3. Personalizza la finestra, poi apri Lua per controllare e copiare il codice. L’anteprima simula le interazioni.'],
 zh:['Builder 使用指南','连接控件','1. 在“创建”中添加标签页和控件。2. 选择控件以编辑名称、数值和回调。3. 调整窗口，然后打开 Lua 检查并复制生成的代码。预览中的交互仅为模拟。'],
 ja:['Builder の使い方','コントロールの連携','1.「作成」でタブとコントロールを追加します。2. コントロールを選んで名前、値、コールバックを編集します。3. ウィンドウを調整し、Luaで生成コードを確認してコピーします。プレビューの操作はシミュレーションです。'],
 ko:['Builder 사용 안내','컨트롤 연결하기','1. 만들기에서 탭과 컨트롤을 추가합니다. 2. 컨트롤을 선택해 이름, 값, 콜백을 편집합니다. 3. 창을 설정한 뒤 Lua에서 생성된 코드를 확인하고 복사합니다. 미리보기 동작은 시뮬레이션입니다.'],
 ru:['Руководство по builder','Связь элементов управления','1. Во вкладке «Создать» добавьте вкладки и элементы. 2. Выберите элемент, чтобы изменить его имя, значения и callback. 3. Настройте окно, затем откройте Lua, чтобы проверить и скопировать код. Взаимодействия в предпросмотре симулируются.'],
 ar:['دليل Builder','ربط عناصر التحكم','١. أضف علامات التبويب وعناصر التحكم من «إنشاء». ٢. اختر عنصرًا لتعديل اسمه وقيمه ودالة callback. ٣. اضبط النافذة ثم افتح Lua لمراجعة الكود ونسخه. التفاعلات في المعاينة محاكاة فقط.'],
 hi:['Builder गाइड','कंट्रोल जोड़ना','1. बनाएँ में टैब और कंट्रोल जोड़ें। 2. नाम, मान और callback बदलने के लिए कोई कंट्रोल चुनें। 3. विंडो सेट करें और Lua में कोड देखकर कॉपी करें। प्रीव्यू की क्रियाएँ केवल सिमुलेशन हैं।'],
 bn:['Builder নির্দেশিকা','কন্ট্রোল যুক্ত করা','১. তৈরি অংশে ট্যাব ও কন্ট্রোল যোগ করুন। ২. নাম, মান ও callback বদলাতে একটি কন্ট্রোল নির্বাচন করুন। ৩. উইন্ডো সাজিয়ে Lua-তে কোড দেখে কপি করুন। প্রিভিউয়ের কার্যকলাপ শুধু সিমুলেশন।'],
 ur:['Builder رہنما','کنٹرولز کو جوڑیں','۱۔ بنائیں میں ٹیبز اور کنٹرولز شامل کریں۔ ۲۔ نام، قدریں اور callback بدلنے کے لیے کنٹرول منتخب کریں۔ ۳۔ ونڈو ترتیب دیں، پھر Lua میں کوڈ دیکھ کر کاپی کریں۔ پیش منظر کے عمل صرف نقل ہیں۔'],
 id:['Panduan builder','Hubungkan kontrol','1. Di Buat, tambahkan tab dan kontrol. 2. Pilih kontrol untuk mengedit nama, nilai, dan callback. 3. Atur jendela, lalu buka Lua untuk meninjau dan menyalin kode. Interaksi pratinjau hanya simulasi.'],
 tr:['Builder kılavuzu','Kontrolleri bağlama','1. Oluştur bölümünde sekmeler ve kontroller ekleyin. 2. Adını, değerlerini ve callback işlevini düzenlemek için kontrolü seçin. 3. Pencereyi ayarlayın, ardından Lua bölümünde kodu inceleyip kopyalayın. Önizleme etkileşimleri simülasyondur.'],
 vi:['Hướng dẫn builder','Liên kết điều khiển','1. Trong Tạo, thêm tab và điều khiển. 2. Chọn điều khiển để sửa tên, giá trị và callback. 3. Tùy chỉnh cửa sổ rồi mở Lua để xem và sao chép mã. Tương tác trong bản xem trước chỉ là mô phỏng.'],

 mr:['Builder मार्गदर्शक','कंट्रोल जोडणे','१. तयार करा मध्ये टॅब आणि कंट्रोल जोडा. २. नाव, मूल्ये आणि callback संपादित करण्यासाठी कंट्रोल निवडा. ३. विंडो सेट करा आणि Lua मध्ये कोड तपासून कॉपी करा. पूर्वावलोकनातील क्रिया केवळ सिम्युलेशन आहेत.'],
 ta:['Builder வழிகாட்டி','கட்டுப்பாடுகளை இணைத்தல்','1. உருவாக்கு பகுதியில் தாவல்களையும் கட்டுப்பாடுகளையும் சேர்க்கவும். 2. பெயர், மதிப்புகள், callback ஆகியவற்றைத் திருத்த ஒரு கட்டுப்பாட்டைத் தேர்ந்தெடுக்கவும். 3. சாளரத்தை அமைத்து Lua-வில் குறியீட்டைச் சரிபார்த்து நகலெடுக்கவும். முன்னோட்டச் செயல்கள் உருவகப்படுத்தப்பட்டவை.'],
 pa:['Builder ਗਾਈਡ','ਕੰਟਰੋਲ ਜੋੜੋ','1. ਬਣਾਓ ਵਿੱਚ ਟੈਬ ਅਤੇ ਕੰਟਰੋਲ ਜੋੜੋ। 2. ਨਾਮ, ਮੁੱਲ ਅਤੇ callback ਸੋਧਣ ਲਈ ਕੰਟਰੋਲ ਚੁਣੋ। 3. ਵਿੰਡੋ ਸੈੱਟ ਕਰੋ, ਫਿਰ Lua ਵਿੱਚ ਕੋਡ ਵੇਖ ਕੇ ਕਾਪੀ ਕਰੋ। ਝਲਕ ਦੀਆਂ ਕਿਰਿਆਵਾਂ ਸਿਰਫ਼ ਸਿਮੂਲੇਸ਼ਨ ਹਨ।'],
 eu:['Builder-aren gida','Kontrolak lotzea','1. Sortu atalean, gehitu fitxak eta kontrolak. 2. Hautatu kontrol bat haren izena, balioak eta callback-a editatzeko. 3. Doitu leihoa eta ireki Lua kodea berrikusi eta kopiatzeko. Aurrebistako interakzioak simulatuak dira.'],
 sw:['Mwongozo wa builder','Kuunganisha vidhibiti','1. Katika Unda, ongeza vichupo na vidhibiti. 2. Chagua kidhibiti ili kuhariri jina, thamani na callback yake. 3. Rekebisha dirisha, kisha fungua Lua kukagua na kunakili msimbo. Mwingiliano wa mwonekano ni wa majaribio tu.'],

function playUiSfx(kind){
  if(uiAudioUnavailable)return;
  var AudioContextType=window.AudioContext||window.webkitAudioContext;
  if(!AudioContextType){uiAudioUnavailable=true;return;}
  try{
    if(!uiAudioContext)uiAudioContext=new AudioContextType();
    var ctx=uiAudioContext;
    if(ctx.state==='suspended'){
      var resume=ctx.resume();
      if(resume&&resume.catch)resume.catch(function(error){console.warn('UI sound could not resume:',error);});
    }
    var now=ctx.currentTime,notes=[],noise=null;
    if(kind==='glass'){notes=[[610,980,0,.22,.025,'sine'],[1120,1540,.035,.16,.012,'sine']];noise=[0,.16,.008,'bandpass',1800,6200];}
    else if(kind==='tap'){notes=[[190,105,0,.048,.022,'sine']];noise=[0,.022,.018,'highpass',4600,1500];}
    else if(kind==='select'){notes=[[430,570,0,.075,.014,'triangle']];noise=[0,.075,.01,'lowpass',2300,600];}
    else if(kind==='switch-on'){notes=[[300,490,0,.085,.02,'triangle'],[650,880,.025,.065,.009,'sine']];noise=[0,.026,.012,'bandpass',2100,700];}
    else if(kind==='switch-off'){notes=[[480,260,0,.085,.019,'triangle'],[740,460,.025,.065,.008,'sine']];noise=[0,.026,.011,'bandpass',2100,650];}
    else if(kind==='add'){notes=[[520,920,0,.12,.018,'triangle'],[780,480,.018,.085,.009,'sine']];}
    else if(kind==='danger'){notes=[[170,82,0,.11,.022,'sine']];noise=[0,.04,.012,'lowpass',520,170];}
    else if(kind==='pop'){notes=[[240,410,0,.105,.019,'sine']];noise=[0,.035,.012,'lowpass',1600,420];}
    else{notes=[[310,180,0,.12,.02,'sine']];noise=[0,.04,.012,'lowpass',1200,300];}
    notes.forEach(function(note){
      var osc=ctx.createOscillator(),gain=ctx.createGain(),start=now+note[2],end=start+note[3];
      osc.type=note[5];
      osc.frequency.setValueAtTime(note[0],start);
      osc.frequency.exponentialRampToValueAtTime(note[1],end);
      gain.gain.setValueAtTime(.0001,start);
      gain.gain.exponentialRampToValueAtTime(note[4],start+.012);
      gain.gain.exponentialRampToValueAtTime(.0001,end);
      osc.connect(gain);gain.connect(ctx.destination);
      osc.onended=function(){osc.disconnect();gain.disconnect();};
      osc.start(start);osc.stop(end+.01);
    });
    if(noise){
      var length=Math.max(1,Math.floor(ctx.sampleRate*noise[1])),buffer=ctx.createBuffer(1,length,ctx.sampleRate),samples=buffer.getChannelData(0);
      for(var i=0;i<length;i++)samples[i]=(Math.random()*2-1)*(1-i/length);
      var source=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),noiseGain=ctx.createGain(),noiseStart=now+noise[0],noiseEnd=noiseStart+noise[1];
      source.buffer=buffer;filter.type=noise[3];filter.frequency.setValueAtTime(noise[4],noiseStart);filter.frequency.exponentialRampToValueAtTime(noise[5],noiseEnd);
      noiseGain.gain.setValueAtTime(noise[2],noiseStart);noiseGain.gain.exponentialRampToValueAtTime(.0001,noiseEnd);
      source.connect(filter);filter.connect(noiseGain);noiseGain.connect(ctx.destination);
      source.onended=function(){source.disconnect();filter.disconnect();noiseGain.disconnect();};
      source.start(noiseStart);source.stop(noiseEnd);
    }
  }catch(error){
    uiAudioUnavailable=true;
    console.warn('UI sound playback is unavailable:',error);
  }
}

function restoreState(state){
  if(!state||!Array.isArray(state.tabs)||!state.tabs.length||!state.win)return false;
  S=state;S.tab=Math.min(S.tab||0,S.tabs.length-1);S.sel=null;S.notifs=Array.isArray(S.notifs)?S.notifs:[];
  if(!S.win.orient)S.win.orient=S.win.sidebar?'horizontal':'vertical';
  return true;
}

function load(){
  try{activeProjectId=localStorage.getItem(ACTIVE_PROJECT_KEY)||null;}catch(e){}
  try{var l=localStorage.getItem(LKEY);if(l&&D[l])lang=l;}catch(e){}
  try{var v=localStorage.getItem(VKEY);if(v==='gen2'||v==='classic')version=v;}catch(e){}
  try{var r=JSON.parse(localStorage.getItem(KEY)||'null');
    if(restoreState(r))return true;}catch(e){}
  var projects=loadProjects(),project=projects.find(function(p){return p.id===activeProjectId;})||projects[0];
  if(project&&restoreState(project.state)){
    activeProjectId=project.id;version=project.version==='classic'?'classic':'gen2';
    try{localStorage.setItem(ACTIVE_PROJECT_KEY,activeProjectId);localStorage.setItem(VKEY,version);}catch(e){}
    return true;
  }
  blank();
  return false;
}
function projectName(){return (S&&S.win&&S.win.name)||tr('untitledProject');}
function loadProjects(){
  try{var p=JSON.parse(localStorage.getItem(PROJECTS_KEY)||'[]');return Array.isArray(p)?p:[];}catch(e){return [];}
}
function saveProjects(projects){
  try{localStorage.setItem(PROJECTS_KEY,JSON.stringify(projects));}catch(e){}
}
function syncActiveProject(){
  if(!S)return;
  var projects=loadProjects();
  if(!activeProjectId){activeProjectId='p'+Date.now().toString(36);try{localStorage.setItem(ACTIVE_PROJECT_KEY,activeProjectId);}catch(e){}}
  var i=projects.findIndex(function(p){return p.id===activeProjectId;});
  var project={id:activeProjectId,name:projectName(),updatedAt:Date.now(),version:version,state:JSON.parse(JSON.stringify(S))};
  if(i>=0)projects[i]=project;else projects.unshift(project);
  saveProjects(projects);
}
